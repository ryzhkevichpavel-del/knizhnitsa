<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Авторея</title>
<style>
  /* ===================== БАЗА (нейтральная, без коричневого) ===================== */
  :root, [data-theme="light"]{
    --bg:#f6f6f4; --panel:#ffffff; --panel2:#efefec; --ink:#1c1c1e; --muted:#83838b;
    --line:#e7e7e2; --paper:#ffffff;
    --accent:#3f4ea3; --accent-soft:rgba(63,78,163,.12); --on-accent:#fff;
    --ok:#3c9b6a; --danger:#d1493f;
    --shadow:0 1px 2px rgba(20,20,30,.05),0 8px 28px rgba(20,20,30,.07);
  }
  [data-theme="dark"]{
    --bg:#161618; --panel:#202023; --panel2:#2a2a2e; --ink:#f1f1f3; --muted:#9a9aa3;
    --line:#2e2e33; --paper:#1b1b1e;
    --accent:#7c8af0; --accent-soft:rgba(124,138,240,.20); --on-accent:#fff;
    --ok:#5fbd86; --danger:#e0685c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;overflow:hidden;transition:background .2s,color .2s}
  button{font-family:inherit;cursor:pointer}
  .ic{display:block;flex-shrink:0}
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}

  /* ===================== КНОПКИ ===================== */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);padding:9px 15px;border-radius:11px;font-size:14px;transition:.14s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
  .btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
  .btn.danger:hover{filter:brightness(1.06);color:#fff}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--accent);background:var(--accent-soft)}
  .btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
  .btn.icon{padding:8px;border-radius:10px}

  /* ===================== ВЕРХНЯЯ ПАНЕЛЬ ===================== */
  .topbar{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);
    border-bottom:1px solid var(--line);position:relative;z-index:20}
  .topbar .spacer{flex:1}
  .tb-side{display:flex;align-items:center;gap:10px;min-width:0}
  .tb-title{font-weight:600;font-size:15px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .tb-title:hover{color:var(--accent)}
  .stat{font-size:13px;color:var(--muted);white-space:nowrap}
  .stat b{color:var(--ink);font-weight:600}
  .update-action{background:#1677ff!important;border-color:#1677ff!important;color:#fff!important;font-weight:700;
    box-shadow:0 5px 16px rgba(22,119,255,.28);transition:transform .14s,background .14s,box-shadow .14s}
  .update-action:hover{background:#368cff!important;border-color:#368cff!important;color:#fff!important;
    transform:translateY(-1px);box-shadow:0 7px 20px rgba(22,119,255,.36)}
  .update-action:focus-visible{outline:3px solid rgba(22,119,255,.3);outline-offset:2px}

  /* ===================== ДОМ (по центру) ===================== */
  #home{height:calc(100vh - 52px);overflow-y:auto;display:flex;flex-direction:column;align-items:center}
  #homeInner{width:100%;max-width:880px;padding:80px 28px 60px;text-align:center}
  #home h1{font-size:36px;margin:0 0 8px;font-weight:700;letter-spacing:-.5px}
  #home .sub{color:var(--muted);margin:0 0 44px;font-size:16px}
  .books-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
  .book-card{width:248px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:22px;min-height:166px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:.16s;
    position:relative;cursor:pointer}
  .book-card:hover{transform:translateY(-3px)}
  .book-card.add{align-items:center;justify-content:center;color:var(--accent);border:1.5px dashed var(--line);
    background:transparent;box-shadow:none;gap:10px}
  .book-card.add:hover{border-color:var(--accent);background:var(--accent-soft)}
  .book-card .bt{font-size:19px;font-weight:650;margin-bottom:8px;letter-spacing:-.2px}
  .book-card .bm{color:var(--muted);font-size:13px}
  .book-card .bspacer{flex:1}
  .book-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
  .book-card .del{position:absolute;top:12px;right:12px;opacity:0;transition:.15s}
  .book-card:hover .del{opacity:1}

  /* ===================== ЭКРАН КНИГИ ===================== */
  #book{display:flex;height:calc(100vh - 52px)}
  .sidebar{width:288px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px}
  .side-group{margin-bottom:22px}
  .side-head{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 8px;color:var(--muted);
    font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
  .side-head .add{color:var(--accent);padding:3px;border-radius:7px;display:flex;cursor:pointer}
  .side-head .add:hover{background:var(--accent-soft)}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;font-size:14px;cursor:pointer;
    color:var(--ink);transition:.12s;position:relative;min-height:44px}
  .nav-item:hover{background:var(--accent-soft)}
  .chapter-item{cursor:grab}
  .chapter-item:active{cursor:grabbing}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav-item .num{color:var(--muted);font-size:12px;min-width:16px;text-align:right}
  .nav-item.active .num{color:var(--accent)}
  .nav-item .avatar{width:26px;height:26px;border-radius:7px;object-fit:cover;background:var(--panel2);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .nav-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-actions{width:50px;display:flex;justify-content:flex-end;gap:2px;opacity:.38;flex-shrink:0;transition:.12s}
  .nav-item:hover .nav-actions,.nav-item.active .nav-actions{opacity:1}
  .nav-actions button{width:23px;height:23px;border:none;background:transparent;color:var(--muted);padding:0;border-radius:7px;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .nav-actions button:hover{color:var(--accent);background:var(--panel)}
  .chapter-list{position:relative}
  .chapter-list.sorting .chapter-item{transition:transform .16s ease,background .12s,border-color .12s}
  .chapter-item{touch-action:none}
  .chapter-item.dragging{z-index:5;background:var(--panel);box-shadow:var(--shadow);transition:none}
  .side-empty{color:var(--muted);font-size:13px;padding:8px 11px;font-style:italic;opacity:.8}

  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column;scrollbar-width:thin;scrollbar-color:rgba(131,131,139,.42) transparent}
  .main::-webkit-scrollbar{width:9px}
  .main::-webkit-scrollbar-track{background:transparent}
  .main::-webkit-scrollbar-thumb{background:rgba(131,131,139,.38);border:2px solid transparent;
    background-clip:content-box;border-radius:999px}
  .main::-webkit-scrollbar-thumb:hover{background:rgba(131,131,139,.68);background-clip:content-box}
  .wrap{--page-pad:clamp(24px,3.2vw,58px);max-width:none;width:100%;margin:0;padding:36px var(--page-pad) 140px;flex:1}
  .chapter-wrap{max-width:none}
  .ed-title{width:100%;border:none;background:transparent;font-size:28px;font-weight:700;color:var(--ink);
    outline:none;margin-bottom:8px;font-family:inherit;letter-spacing:-.4px}
  .ed-meta{display:flex;gap:13px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:22px;
    border-bottom:1px solid var(--line);padding-bottom:16px;flex-wrap:wrap}
  .ed-meta .saved{color:var(--ok);display:inline-flex;align-items:center;gap:5px}
  .ed-body{display:block;width:100%;min-height:58vh;border:none;background:transparent;outline:none;resize:none;overflow-y:hidden;
    font-family:"Georgia","Times New Roman",serif;font-size:var(--ed-size,19px);line-height:1.85;color:var(--ink)}
  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
    color:var(--muted);text-align:center;gap:14px;padding:40px}
  .placeholder .pic{color:var(--line)}

  /* ===================== ПОЛЯ ===================== */
  .fld label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600}
  .fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;
    padding:11px 13px;font-family:inherit;font-size:15px;color:var(--ink);outline:none;transition:.14s}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .fld textarea{resize:none;overflow:hidden;line-height:1.6;min-height:46px}
  .fld select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2383838b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:38px}
  .fld-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld-grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}
  .fld-stack{display:flex;flex-direction:column;gap:18px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .overview-wrap{padding-top:20px}
  .overview-identity{grid-template-columns:minmax(0,2fr) minmax(260px,1fr);align-items:end}
  .fld .overview-title-input{font-size:18px;font-weight:650;padding:13px 14px}
  .ovstats{display:flex;gap:30px;flex-wrap:wrap;margin:14px 0 30px;padding-bottom:24px;border-bottom:1px solid var(--line)}
  .ovstat .n{font-size:25px;font-weight:700;letter-spacing:-.5px}
  .ovstat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

  /* ===================== ПЕРСОНАЖ: ПРОФИЛЬ ===================== */
  .pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .profile-top{display:flex;gap:24px;align-items:flex-start;margin-bottom:8px}
  .portrait{width:160px;flex-shrink:0;border-radius:18px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .portrait img{width:100%;height:auto;display:block}
  .portrait.empty{aspect-ratio:4/5}
  .character-wrap{max-width:none}
  .character-layout{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:28px;align-items:start}
  .character-photo-panel{width:100%;position:sticky;top:28px}
  .character-main{min-width:0;max-width:none}
  .portrait.large{width:100%;aspect-ratio:4/5;min-height:280px;position:relative;isolation:isolate;
    background:var(--panel2);border-color:var(--line)}
  .portrait.large .portrait-backdrop{position:absolute;inset:-24px;width:calc(100% + 48px);height:calc(100% + 48px);
    object-fit:cover;filter:blur(18px) saturate(.9) brightness(.94);transform:scale(1.06);opacity:.96;pointer-events:none;z-index:0}
  .portrait.large::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.02),rgba(0,0,0,.08));
    box-shadow:inset 0 0 28px rgba(0,0,0,.12);pointer-events:none;z-index:1}
  .portrait.large .portrait-image{position:relative;width:100%;height:100%;object-fit:contain;display:block;z-index:2;
    filter:drop-shadow(0 4px 14px rgba(0,0,0,.2))}
  .portrait-button{padding:0;cursor:zoom-in;text-align:inherit}
  .portrait-button:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .photo-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .profile-id{flex:1;min-width:0;padding-top:6px}
  .profile-id .pname{font-size:30px;font-weight:700;letter-spacing:-.4px;margin:0 0 10px}
  .badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
    padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
  .profile-meta{color:var(--muted);font-size:14px;margin-top:12px;line-height:1.7}
  .profile-meta b{color:var(--ink);font-weight:600}
  .alias-line{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.55}
  .character-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:18px 0 4px}
  .character-tabs button{border:none;background:transparent;color:var(--muted);padding:10px 12px;border-radius:9px 9px 0 0;
    display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650;cursor:pointer}
  .character-tabs button:hover{background:var(--accent-soft);color:var(--accent)}
  .character-tabs button.on{background:var(--accent-soft);color:var(--accent)}
  .section{margin-top:26px}
  .section h4{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 8px;font-weight:700}
  .section p{margin:0;font-size:15.5px;line-height:1.7;white-space:pre-wrap}
  .empty-note{color:var(--muted);font-style:italic;opacity:.8}
  .lore-wrap{padding-top:0}
  .lore-pagehead{position:sticky;top:0;z-index:12;display:flex;align-items:center;justify-content:space-between;gap:22px;
    margin:0 calc(0px - var(--page-pad)) 28px;padding:18px var(--page-pad);
    border-bottom:1px solid var(--line);background:color-mix(in srgb,var(--bg) 94%,transparent);backdrop-filter:blur(12px)}
  .lore-heading{min-width:0}
  .lore-heading h1{margin:0;font-size:clamp(25px,2.2vw,34px);line-height:1.16;letter-spacing:-.45px;overflow-wrap:anywhere}
  .lore-view-heading{display:flex;align-items:center;gap:12px;flex:1;flex-wrap:wrap}
  .lore-view-heading h1{min-width:0}
  .lore-view-heading .badge{height:28px;padding:0 12px;line-height:1;align-items:center;justify-content:center;transform:translateY(3px)}
  .lore-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:9px;color:var(--muted);font-size:13px}
  .lore-actions{display:flex;align-items:center;gap:8px;flex-shrink:0}
  .lore-summary{margin:0 0 28px;padding:16px 18px;border-left:3px solid var(--accent);border-radius:0 12px 12px 0;
    background:var(--accent-soft);font-size:16px;line-height:1.68;white-space:pre-wrap}
  .lore-layout{display:grid;grid-template-columns:minmax(0,1fr) minmax(210px,250px);gap:clamp(28px,3.5vw,58px);align-items:start}
  .lore-layout.without-outline{grid-template-columns:minmax(0,1fr)}
  .lore-document{min-width:0;font-family:"Georgia","Times New Roman",serif;font-size:18px;line-height:1.78;overflow-wrap:anywhere}
  .lore-document>:first-child{margin-top:0}
  .lore-document>:last-child{margin-bottom:0}
  .lore-document h1,.lore-document h2,.lore-document h3,.lore-document h4{font-family:"Segoe UI",Roboto,system-ui,sans-serif;
    line-height:1.22;letter-spacing:-.25px;scroll-margin-top:112px}
  .lore-document h1{font-size:30px;margin:40px 0 16px}
  .lore-document h2{font-size:25px;margin:36px 0 14px}
  .lore-document h3{font-size:21px;margin:30px 0 12px}
  .lore-document h4{font-size:18px;margin:26px 0 10px}
  .lore-document p{margin:0 0 20px;white-space:normal}
  .lore-document strong{font-weight:750}
  .lore-document em{font-style:italic}
  .lore-document ul,.lore-document ol{margin:0 0 22px;padding-left:28px}
  .lore-document li{margin:6px 0;padding-left:3px}
  .lore-document blockquote{margin:24px 0;padding:3px 0 3px 18px;border-left:3px solid var(--line);color:var(--muted)}
  .lore-document code{font-family:Consolas,"Courier New",monospace;font-size:.9em;background:var(--panel2);padding:2px 5px;border-radius:5px}
  .lore-document hr{border:0;border-top:1px solid var(--line);margin:34px 0}
  .lore-outline{position:sticky;top:104px;border-left:1px solid var(--line);padding-left:18px}
  .lore-outline-title{font-size:11px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:750;margin-bottom:10px}
  .lore-outline a{display:block;color:var(--muted);text-decoration:none;font-size:13px;line-height:1.35;padding:6px 8px;border-radius:8px;overflow-wrap:anywhere}
  .lore-outline a:hover{color:var(--accent);background:var(--accent-soft)}
  .lore-outline a.level-3{padding-left:18px}.lore-outline a.level-4{padding-left:28px}
  .lore-edit-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(220px,1fr);gap:16px;margin-bottom:22px}
  .lore-text-field textarea{min-height:52vh;font-family:"Georgia","Times New Roman",serif;font-size:17px;line-height:1.72}
  .format-toolbar{display:flex;align-items:center;gap:5px;flex-wrap:wrap;margin:0 0 8px;padding:6px;border:1px solid var(--line);
    border-radius:11px;background:var(--panel)}
  .format-toolbar button{min-width:34px;height:32px;border:0;border-radius:8px;background:transparent;color:var(--ink);font-size:14px;font-weight:700}
  .format-toolbar button:hover{background:var(--accent-soft);color:var(--accent)}
  .relationship-list{display:flex;flex-direction:column;gap:10px}
  .relationship-card{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);
    background:var(--panel);border-radius:12px;padding:12px 14px}
  .relationship-card .thread-sample{width:58px}
  .relationship-name{font-size:15px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .relationship-meta{font-size:12px;color:var(--muted);margin-top:4px}
  .relationship-note{grid-column:1 / -1;color:var(--muted);font-size:13px;line-height:1.55;white-space:pre-wrap}
  .relationship-actions{display:flex;gap:4px}
  .quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .quick-tile{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;display:flex;gap:11px;
    align-items:flex-start;text-align:left;color:var(--ink);cursor:pointer}
  .quick-tile:hover{border-color:var(--accent);background:var(--accent-soft)}
  .quick-tile .qt-ico{color:var(--accent);padding-top:1px}
  .quick-tile .qt-text{min-width:0;display:flex;flex-direction:column;gap:4px}
  .quick-tile .qt-title{display:block;font-weight:750;font-size:14px;line-height:1.25}
  .quick-tile .qt-sub{display:block;color:var(--muted);font-size:12px;line-height:1.45}
  .appearance-list{display:flex;flex-direction:column;gap:10px}
  .appearance-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);
    background:var(--panel);border-radius:12px;padding:12px 14px}
  .appearance-title{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .appearance-meta{font-size:12px;color:var(--muted);margin-top:3px}
  .appearance-snippet{grid-column:1 / -1;font-size:13px;line-height:1.55;color:var(--muted);white-space:normal}
  .appearance-snippet mark{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px}

  /* ===================== ПРЕДПРОСМОТР ===================== */
  #preview{position:fixed;inset:0;background:#d7d7d3;z-index:40;overflow:auto;padding:76px 20px 46px;color:#1d1d1f}
  [data-theme="dark"] #preview{background:#111113}
  .pv-toolbar{position:fixed;top:10px;left:50%;transform:translateX(-50%);z-index:41;display:flex;align-items:center;gap:8px;
    max-width:calc(100vw - 24px);overflow-x:auto;padding:7px;background:color-mix(in srgb,var(--panel) 96%,transparent);
    border:1px solid var(--line);border-radius:13px;box-shadow:0 8px 28px rgba(0,0,0,.16);backdrop-filter:blur(12px)}
  .pv-tool{display:flex;align-items:center;gap:6px;white-space:nowrap}
  .pv-tool label{font-size:11px;text-transform:uppercase;letter-spacing:.55px;color:var(--muted);font-weight:700}
  .pv-tool select{height:32px;border:1px solid var(--line);border-radius:9px;background:var(--panel);color:var(--ink);
    font:13px/1 "Segoe UI",sans-serif;padding:0 30px 0 10px;outline:none}

  .pv-zoom{display:flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--panel)}

  .pv-count{font-size:13px;color:var(--muted);white-space:nowrap;padding:0 4px;font-variant-numeric:tabular-nums}

  .pv-empty{color:#777;text-indent:0!important;text-align:center!important;font-style:italic}
  .pv-page-number{position:absolute;left:0;right:0;bottom:5.5mm;text-align:center;font:9pt/1 "Georgia",serif;color:#333}
  .pv-title-page{padding:24mm 21mm;text-align:center}
  .pv-title-page .pv-page-body{width:100%;display:flex;flex-direction:column;align-items:center;justify-content:flex-start;gap:7mm;padding-top:14%}
  .pv-title-page .pv-author{width:100%;font:11pt/1.35 "Georgia",serif;letter-spacing:.3px;text-align:center;white-space:normal;overflow-wrap:normal;word-break:normal}
  .pv-title-page .pv-book-title{width:100%;font:700 25pt/1.2 "Georgia",serif;text-align:center;white-space:normal;overflow-wrap:normal;word-break:normal}
  .pv-measure{position:absolute;left:-100000px;top:0;visibility:hidden;pointer-events:none}
  .pv-measure .pv-sheet{zoom:1}

  /* ===================== МОДАЛКИ ===================== */
  .modal-back{position:fixed;inset:0;background:rgba(10,10,15,.5);z-index:50;display:flex;align-items:center;

  .modal.history{max-width:920px}
  .modal h3{margin:0;padding:24px 26px 4px;font-size:19px;font-weight:680;letter-spacing:-.3px}
  .mpad{padding:16px 26px 6px}
  .mmsg{color:var(--muted);font-size:14px;line-height:1.55;padding-bottom:8px}
  .flbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:8px;font-weight:600}
  .finput{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;
    font-family:inherit;font-size:15px;color:var(--ink);outline:none}

  .photo-view-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  .modal.photo h3{padding:0;margin:0;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .photo-view-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px}
  .photo-view-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
  .set-section{padding:18px 26px;border-top:1px solid var(--line)}

  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{border:none;background:transparent;color:var(--muted);padding:8px 16px;border-radius:8px;display:flex;align-items:center;gap:7px;font-size:14px}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}

  .swatch:hover{transform:scale(1.05)}
  .swatch.on{border-color:var(--ink)}
  .swatch .nm{font-size:10px;color:#fff;opacity:0;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .swatch.on .nm,.swatch:hover .nm{opacity:1}
  .history-current{margin:10px 16px 6px;padding:14px 16px;border:1px solid color-mix(in srgb,var(--accent),var(--line) 58%);
    border-radius:13px;background:color-mix(in srgb,var(--accent-soft),var(--paper) 58%);display:flex;align-items:center;
    justify-content:space-between;gap:14px;flex-wrap:wrap}
  .history-current-main{display:flex;flex-direction:column;gap:3px}.history-current-main strong{font-size:14px}
  .history-current-main span{color:var(--muted);font-size:12px}
  .history-current-side{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
  .history-section-title{padding:12px 18px 2px;color:var(--muted);font-size:11px;font-weight:750;text-transform:uppercase;letter-spacing:.65px}
  .history-list{padding:8px 16px 18px;display:flex;flex-direction:column;gap:10px}
  .ver-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:11px 18px;padding:15px 16px;
    border:1px solid var(--line);border-radius:13px;background:var(--paper)}
  .ver-row .vinfo{min-width:0}
  .ver-row .vt{display:flex;align-items:center;gap:7px;flex-wrap:wrap;font-size:14px;font-weight:700}
  .ver-reason{font-size:12px;font-weight:500;color:var(--muted)}

  .btn[disabled]{opacity:.55;cursor:default;pointer-events:none}
  .diff-legend{display:flex;gap:16px;flex-wrap:wrap;padding:8px 26px 14px;color:var(--muted);font-size:12px}
  .diff-legend span{display:inline-flex;align-items:center;gap:6px}.diff-legend i{width:11px;height:11px;border-radius:3px}
  .diff-legend .add i{background:rgba(42,163,115,.25)}.diff-legend .del i{background:rgba(207,78,91,.24)}
  .diff-body{margin:0 26px 12px;padding:18px 20px;border:1px solid var(--line);border-radius:13px;background:var(--paper);
    font-family:Georgia,"Times New Roman",serif;font-size:16px;line-height:1.75;white-space:pre-wrap;overflow-wrap:anywhere}
  .diff-add{background:rgba(42,163,115,.22);color:var(--ink);border-radius:3px;padding:1px 2px;text-decoration:none}
  .diff-del{background:rgba(207,78,91,.2);color:var(--muted);border-radius:3px;padding:1px 2px;text-decoration:line-through}
  .diff-note{margin:0 26px 12px;color:var(--muted);font-size:13px;line-height:1.5}
  .restore-impact{margin:0 26px 8px;padding:12px 14px;border-radius:11px;background:var(--panel2);color:var(--muted);font-size:13px}
  .import-preview{margin:10px 26px 4px;max-height:44vh;overflow:auto;padding:16px 18px;border:1px solid var(--line);
    border-radius:13px;background:var(--paper);font-family:Georgia,"Times New Roman",serif;font-size:15px;line-height:1.65;white-space:pre-wrap}

  .search-box{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);
    border-radius:14px;padding:12px 14px}

  .search-box .ic{color:var(--muted)}

  .search-results{padding:4px 14px 16px;display:flex;flex-direction:column;gap:8px;min-height:190px}
  .search-empty{padding:34px 12px;color:var(--muted);text-align:center;line-height:1.5}

  .sr-kind{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;white-space:nowrap}

  .sr-book{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sr-snippet{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}

  .plan-wrap{max-width:none;padding-top:18px}
  .plan-tabs{display:flex;gap:4px;margin:0 0 28px;border-bottom:1px solid var(--line)}

    padding:11px 15px;font-size:14px;font-weight:650;cursor:pointer}
  .plan-tab:hover{color:var(--accent);background:var(--accent-soft)}
  .plan-tab.active{color:var(--accent);border-bottom-color:var(--accent);background:transparent}
  .plan-document-editor{max-width:none;margin:0;padding:18px 0 70px}
  .plan-document-head{display:flex;align-items:center;justify-content:space-between;gap:24px;padding-bottom:18px;
    border-bottom:1px solid var(--line)}
  .plan-document-title{margin:0;font-size:23px;letter-spacing:-.25px;min-width:0}

    font-size:13px;flex-wrap:wrap;margin-left:auto}

  .plan-item-select{max-width:260px;border:1px solid var(--line);background:var(--paper);color:var(--ink);
    border-radius:10px;padding:7px 36px 7px 11px;font-size:13px;outline:none;text-overflow:ellipsis}

    font-size:18px;line-height:1.82;white-space:pre-wrap}

  .trash-list{padding:4px 14px 16px;display:flex;flex-direction:column;gap:8px;min-height:160px}
  .trash-card{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 14px}
  .trash-head{display:flex;align-items:baseline;gap:10px;min-height:20px}
  .trash-kind{font-size:11px;line-height:18px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;white-space:nowrap}
  .trash-title{font-weight:650;line-height:18px;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .trash-sub{font-size:12px;color:var(--muted);margin-top:5px}
  .trash-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .map-wrap{max-width:none;padding:22px 28px 46px}
  .map-pagehead{margin-bottom:14px}

  .map-tools{display:flex;align-items:center;gap:8px;flex-wrap:wrap}

  .map-studio{display:grid;grid-template-columns:minmax(540px,1fr) 360px;gap:14px;align-items:stretch}
  .map-board{position:relative;height:calc(100vh - 148px);min-height:650px;border:1px solid var(--line);border-radius:16px;
    background:
      radial-gradient(circle at 1px 1px,color-mix(in srgb,var(--muted),transparent 82%) 1px,transparent 1.5px),
      linear-gradient(180deg,color-mix(in srgb,var(--panel),var(--bg) 20%),var(--paper));
    background-size:26px 26px,100% 100%;overflow:hidden;margin-top:0;cursor:grab;touch-action:none}
  .map-board.panning{cursor:grabbing}
  .map-help{position:absolute;left:14px;bottom:12px;z-index:7;padding:7px 10px;border:1px solid var(--line);
    border-radius:9px;background:color-mix(in srgb,var(--panel),transparent 10%);color:var(--muted);font-size:11px;
    pointer-events:none;box-shadow:0 4px 18px rgba(20,24,38,.08)}

    height:calc(100% / var(--map-world-scale,1));transform:translate(var(--map-pan-x,0px),var(--map-pan-y,0px)) scale(var(--map-zoom,1));
    transform-origin:0 0;transition:transform .16s ease}

    cursor:grab;transition:transform .14s,border-color .14s,box-shadow .14s;touch-action:none;user-select:none}

  .link-list{display:flex;flex-direction:column;gap:9px;overflow-y:auto;padding:14px;min-height:0}

  [data-theme="dark"] .map-board{background:
      radial-gradient(circle at 1px 1px,rgba(150,158,178,.18) 1px,transparent 1.5px),
      linear-gradient(180deg,#1b1b1f,#18181b)}

    .lore-edit-grid{grid-template-columns:1fr}
    .map-wrap{padding:18px 16px 46px}
    .map-studio{grid-template-columns:1fr}
    .map-board,.map-panel{height:auto;min-height:560px}

    .map-node{width:120px}
  }

  .toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(8px);background:var(--ink);
    color:var(--bg);padding:11px 20px;border-radius:13px;font-size:14px;z-index:60;opacity:0;transition:.25s;
    pointer-events:none;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  .text-context-menu{position:fixed;z-index:100;min-width:210px;padding:5px;background:var(--panel);color:var(--ink);
    border:1px solid var(--line);border-radius:11px;box-shadow:0 14px 42px rgba(0,0,0,.22);user-select:none}
  .text-context-menu button{width:100%;display:flex;align-items:center;justify-content:space-between;gap:22px;border:none;
    border-radius:7px;background:transparent;color:inherit;padding:8px 10px;font:13px/1.2 inherit;text-align:left;cursor:pointer}
  .text-context-menu button:hover:not(:disabled){background:var(--accent-soft);color:var(--accent)}
  .text-context-menu button:disabled{color:var(--muted);opacity:.48;cursor:default}
  .text-context-menu kbd{font:11px/1.2 "Segoe UI",sans-serif;color:var(--muted);background:transparent}
  .text-context-separator{height:1px;background:var(--line);margin:4px 5px}
  .global-save-status{position:fixed;right:14px;bottom:14px;z-index:45;display:flex;align-items:center;gap:6px;
    max-width:min(520px,calc(100vw - 28px));padding:7px 11px;border:1px solid var(--line);border-radius:10px;
    background:color-mix(in srgb,var(--panel) 94%,transparent);box-shadow:var(--shadow);color:var(--muted);font-size:12px}
  .global-save-status.saved{color:var(--ok)}
  .global-save-status.error{color:var(--danger);border-color:color-mix(in srgb,var(--danger),var(--line) 55%)}
  .global-save-status[hidden]{display:none}
  [role="button"]:focus-visible,.book-card:focus-visible,.nav-item:focus-visible,.side-book:focus-visible,.swatch:focus-visible,

  .chapter-order-actions button{width:23px;height:23px;border:none;background:transparent;color:var(--muted);padding:0;border-radius:7px}
  .chapter-order-actions button:hover:not(:disabled){color:var(--accent);background:var(--panel)}
  .chapter-order-actions button:disabled{opacity:.28;cursor:default}
  .size-ctl{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:9px;overflow:hidden}
  .size-ctl button{border:none;background:var(--panel);padding:5px 11px;color:var(--muted);font-size:14px;font-weight:600}
  .size-ctl button:hover{color:var(--accent)}

function selectAllEditableText(el){

  if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"){ el.select(); return; }
  const range=document.createRange(); range.selectNodeContents(el);
  const selection=window.getSelection(); selection.removeAllRanges(); selection.addRange(range);
}
function replaceEditableSelection(el,text,inputType){
  el.focus();
  if(document.execCommand&&document.execCommand("insertText",false,text)) return;
  if(el.tagName==="INPUT"||el.tagName==="TEXTAREA"){
    const start=Number.isInteger(el.selectionStart)?el.selectionStart:el.value.length,end=Number.isInteger(el.selectionEnd)?el.selectionEnd:start;
    el.setRangeText(text,start,end,"end");
  }else{
    const selection=window.getSelection();
    if(!selection||!selection.rangeCount) return;
    const range=selection.getRangeAt(0); range.deleteContents();
    const node=document.createTextNode(text); range.insertNode(node); range.setStartAfter(node); range.collapse(true);
    selection.removeAllRanges(); selection.addRange(range);
  }
  el.dispatchEvent(new InputEvent("input",{bubbles:true,inputType:inputType||"insertText",data:text}));
}
async function writeSystemClipboard(text){
  const a=api();
  if(a&&a.clipboard_write_text){
    try{ if(apiOk(await a.clipboard_write_text(text,lang()))) return true; }catch(e){}
  }
  try{ await navigator.clipboard.writeText(text); return true; }catch(e){ return false; }
}
async function readSystemClipboard(){
  const a=api();
  if(a&&a.clipboard_read_text){
    try{ const res=await a.clipboard_read_text(lang()); if(apiOk(res)) return String(res.text||""); }catch(e){}
  }
  try{ return await navigator.clipboard.readText(); }catch(e){ return null; }
}
async function runTextContextCommand(command,target){
  if(!target||!target.el||!document.contains(target.el)) return;
  const el=target.el;
  if(command==="undo"||command==="redo"){ el.focus(); document.execCommand(command); return; }
  if(command==="selectAll"){ selectAllEditableText(el); return; }
  if(command==="paste"){
    const text=await readSystemClipboard();
    if(text===null){ toast(t("clipboardUnavailable")); return; }
    if(!text){ toast(t("clipboardEmpty")); return; }
    replaceEditableSelection(el,text,"insertFromPaste");
    return;
  }
  if(command==="delete"){ replaceEditableSelection(el,"","deleteContent"); return; }
  const text=selectedEditableText(el);
  if(!text) return;
  if(!await writeSystemClipboard(text)){ toast(t("clipboardUnavailable")); return; }
  if(command==="cut") replaceEditableSelection(el,"","deleteByCut");
}
function closeTextContextMenu(){
  const root=document.getElementById("contextMenuRoot"),wasOpen=!!(root&&root.firstChild);
  if(root) root.innerHTML="";
  textContextTarget=null;
  return wasOpen;
}
function showTextContextMenu(event,target){
  const root=document.getElementById("contextMenuRoot"),hasSelection=!!selectedEditableText(target.el),editable=target.editable;
  textContextTarget=target;
  root.innerHTML=`<div class="text-context-menu" role="menu">
    ${editable?`<button type="button" data-command="undo"><span>${t("undo")}</span><kbd>Ctrl+Z</kbd></button>
    <button type="button" data-command="redo"><span>${t("redo")}</span><kbd>Ctrl+Y</kbd></button>
    <div class="text-context-separator"></div>
    <button type="button" data-command="cut" ${hasSelection?'':'disabled'}><span>${t("cut")}</span><kbd>Ctrl+X</kbd></button>`:""}
    <button type="button" data-command="copy" ${hasSelection?'':'disabled'}><span>${t("copy")}</span><kbd>Ctrl+C</kbd></button>
    ${editable?`<button type="button" data-command="paste"><span>${t("paste")}</span><kbd>Ctrl+V</kbd></button>
    <button type="button" data-command="delete" ${hasSelection?'':'disabled'}><span>${t("delete")}</span><kbd>Del</kbd></button>
    <div class="text-context-separator"></div>
    <button type="button" data-command="selectAll"><span>${t("selectAll")}</span><kbd>Ctrl+A</kbd></button>`:""}
  </div>`;
  const menu=root.firstElementChild;
  menu.style.left="0px"; menu.style.top="0px";
  const left=Math.max(8,Math.min(event.clientX,window.innerWidth-menu.offsetWidth-8));
  const top=Math.max(8,Math.min(event.clientY,window.innerHeight-menu.offsetHeight-8));
  menu.style.left=left+"px"; menu.style.top=top+"px";
  menu.querySelectorAll("button").forEach(button=>{
    button.addEventListener("pointerdown",e=>e.preventDefault());
    button.addEventListener("click",()=>{
      const command=button.dataset.command,current=textContextTarget;
      closeTextContextMenu();
      runTextContextCommand(command,current);
    });
  });
}

async function persistPayload(payload,flush=false){
  if(!payload||payload===lastSavedPayload) return true;
  if(saveInFlight){ queuedSavePayload=payload; return saveInFlight; }
  const a=api();
  if(!a||(!a.save&&!a.flush_save)){ markSaveError(t("saveModuleMissing")); return false; }
  saveInFlight=(async()=>{
    try{
      const fn=flush&&a.flush_save?a.flush_save.bind(a):(a.save?a.save.bind(a):a.flush_save.bind(a));
      const res=await fn(payload,lang());
      if(apiOk(res)){ lastSavedPayload=payload; markSaved(); return true; }
      markSaveError(apiError(res,t("saveLibraryFail"))); return false;
    }catch(e){ markSaveError(t("saveLibraryFail")+" "+(e&&e.message?e.message:e)); return false; }
    finally{
      saveInFlight=null;
      const next=queuedSavePayload; queuedSavePayload="";
      if(next&&next!==lastSavedPayload) persistPayload(next,flush);
    }
  })();
  return saveInFlight;
}
function save(){

}

  return {ok:false,error:apiError(raw,t("loadFailMsg")),recovery_available:!!(raw&&raw.recovery_available)};
}

async function boot(){
  const a=api();
  let recoveryOffer=false;
  if(a&&a.load){
    try{
      const result=decodedLoadResult(await a.load());
      if(!result.ok){ showLoadFailure(result); return; }
      if(result.data!==undefined&&result.data!==null&&result.data!=="") state=parseLoadedData(result.data);
      recoveryOffer=result.recovery_available;
    }catch(e){ showLoadFailure({error:e&&e.message?e.message:t("loadFailMsg"),recovery_available:true}); return; }
  }
  ensureData();
  const s=state.settings=state.settings||{};
  if(s.theme!=="dark") s.theme="light";
  if(!s.accent) s.accent=DEFAULT_ACCENT;
  if(!s.fontSize) s.fontSize=19;
  if(s.lang!=="en") s.lang="ru";
  if(s.autoDialogueDash!==false) s.autoDialogueDash=true;
  if(s.automaticUpdateChecks!==false) s.automaticUpdateChecks=true;
  if(typeof s.defaultAuthor!=="string"){
    const known=[...new Set(state.books.map(book=>String(book.author||"").trim()).filter(Boolean))];
    s.defaultAuthor=known.length===1?known[0]:"";
  }
  if(!["single","spread"].includes(s.previewView)) s.previewView="spread";
  s.previewZoom=Math.min(PREVIEW_MAX_ZOOM,Math.max(PREVIEW_MIN_ZOOM,Number(s.previewZoom)||1));
  document.documentElement.lang=s.lang;
  if(!Array.isArray(s.roles)||!s.roles.length) s.roles=DEFAULT_ROLES.slice();
  editorFontSize=s.fontSize;
  lastSavedPayload=serializedState();
  applyTheme(); render();
  if(s.automaticUpdateChecks!==false) startBackgroundUpdateCheck();
  if(recoveryOffer){
    const restore=await openConfirm({title:t("recoveryOfferTitle"),message:t("recoveryOfferMsg"),ok:t("recoverLatest"),danger:false});
    if(restore) recoverLatestLibrary();
  }
}
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function now(){ return Date.now(); }
function countWords(t){ t=(t||"").trim(); return t?t.split(/\s+/).length:0; }
function countChars(t){ return (t||"").length; }
function fmt(n){ return n.toLocaleString(dateLocale()); }
function fitChapterBody(body,followEnd=false){
  if(!body) return;
  const scroller=body.closest(".main"),scrollTop=scroller?scroller.scrollTop:0;
  const bottomGap=scroller?Math.max(0,scroller.scrollHeight-scroller.clientHeight-scrollTop):0;
  const followBottom=followEnd&&scroller&&body.selectionStart===body.value.length&&body.selectionEnd===body.value.length&&
    bottomGap<=Math.max(240,scroller.clientHeight*.4);
  body.style.height="auto";
  body.style.height=body.scrollHeight+"px";
  if(scroller) scroller.scrollTop=followBottom?
    Math.max(0,scroller.scrollHeight-scroller.clientHeight-bottomGap):scrollTop;
}
function uniqueClean(list){
  const seen=new Set(),out=[];
  (list||[]).forEach(v=>{
    const s=String(v||"").replace(/\s+/g," ").trim();
    const key=s.toLocaleLowerCase("ru-RU");
    if(s&&s.length>=2&&!seen.has(key)){ seen.add(key); out.push(s); }
  });
  return out;
}
function parseAliases(text){ return uniqueClean(String(text||"").split(/[\n,;]+/)); }
function characterTerms(c){
  normalizeCharacter(c);
  return uniqueClean([c.name,...(c.aliases||[])]).sort((a,b)=>b.length-a.length);
}
function characterMatcher(c){
  const terms=characterTerms(c);
  if(!terms.length) return null;
  return new RegExp(`(^|[^\\p{L}\\p{N}_])(${terms.map(escapeRegExp).join("|")})(?=$|[^\\p{L}\\p{N}_])`,"giu");
}
function characterMentionsInText(c,text){
  const rx=characterMatcher(c),src=text||"",res=[];
  if(!rx) return res;
  let m;
  while((m=rx.exec(src))!==null){
    const start=m.index+(m[1]||"").length,term=m[2]||"";
    res.push({index:start,term});
  }
  return res;
}
function characterChapterAppearances(b,c){
  return (b.chapters||[]).map((ch,i)=>{
    const mentions=characterMentionsInText(c,ch.content||"");
    return {chapter:ch,index:i,count:mentions.length,first:mentions[0]||null};
  }).filter(x=>x.count>0);
}
function mentionSnippet(text,mention){
  const src=text||"",start=Math.max(0,mention.index-70),end=Math.min(src.length,mention.index+mention.term.length+90);
  const before=(start>0?"…":"")+src.slice(start,mention.index);
  const hit=src.slice(mention.index,mention.index+mention.term.length);
  const after=src.slice(mention.index+mention.term.length,end)+(end<src.length?"…":"");
  return `${escapeHtml(before)}<mark>${escapeHtml(hit)}</mark>${escapeHtml(after)}`;
}
function bookWordCount(b){ return b.chapters.reduce((s,c)=>s+countWords(c.content),0); }
function bookCharCount(b){ return b.chapters.reduce((s,c)=>s+countChars(c.content),0); }
function statsLine(b){
  const w=bookWordCount(b),ch=bookCharCount(b),pages=Math.max(0,Math.round(w/WORDS_PER_PAGE)),sheets=ch/CHARS_PER_SHEET;
  return `<b>${fmt(w)}</b> ${t("words")} · <b>≈${fmt(pages)}</b> ${t("pages")} · ${sheets.toFixed(1)} ${t("authorSheetShort")}`;
}
function getBook(id){ return state.books.find(b=>b.id===id); }
function curBook(){ return getBook(route.bookId); }
function ensureData(){
  state.books=Array.isArray(state.books)?state.books:[];
  state.trash=state.trash||{};
  state.trash.books=Array.isArray(state.trash.books)?state.trash.books:[];
  state.trash.chapters=Array.isArray(state.trash.chapters)?state.trash.chapters:[];
  state.trash.characters=Array.isArray(state.trash.characters)?state.trash.characters:[];
  state.trash.lore=Array.isArray(state.trash.lore)?state.trash.lore:[];
  state.books.forEach(b=>{
    if(b.author===undefined) b.author="";
    if(!BOOK_FORMATS[b.previewFormat]) b.previewFormat="standard";
    if(b.planText===undefined) b.planText="";
    if(!Array.isArray(b.planVersions)) b.planVersions=[];
    b.chapters=Array.isArray(b.chapters)?b.chapters:[];
    b.characters=Array.isArray(b.characters)?b.characters:[];
    b.characterLinks=Array.isArray(b.characterLinks)?b.characterLinks:[];
    b.lore=Array.isArray(b.lore)?b.lore:[];
    b.chapters.forEach(normalizeChapter);
    b.characters.forEach(normalizeCharacter);
    b.characterLinks.forEach(normalizeCharacterLink);
    b.lore.forEach(normalizeLore);
  });
}
function normalizeChapter(ch){
  if(ch.planSummary===undefined) ch.planSummary="";
  if(ch.planNotes===undefined) ch.planNotes="";
  if(ch.planText===undefined){
    const legacy=[ch.planSummary,ch.planNotes].map(v=>String(v||"").trim()).filter(Boolean);
    ch.planText=legacy.join("\n\n");
  }
  if(!Array.isArray(ch.versions)) ch.versions=[];
  if(!Array.isArray(ch.planVersions)) ch.planVersions=[];
  return ch;
}
function cloneData(v){ return JSON.parse(JSON.stringify(v)); }
function normalizeCharacter(c){
  if(!CHARACTER_GENDERS.includes(c.gender)) c.gender="";
  if(c.arcText===undefined) c.arcText="";
  if(!Array.isArray(c.arcVersions)) c.arcVersions=[];
  if(c.aliases===undefined) c.aliases=[];
  if(typeof c.aliases==="string") c.aliases=parseAliases(c.aliases);
  if(!Array.isArray(c.aliases)) c.aliases=[];
  c.aliases=uniqueClean(c.aliases);
  return c;
}
function normalizeLore(item){
  if(!item.type) item.type="Заметка";
  if(item.title===undefined) item.title="";
  if(item.summary===undefined) item.summary="";
  if(item.details===undefined) item.details="";
  if(item.links===undefined) item.links="";
  return item;
}
function normalizeCharacterLink(link){
  if(!link.id) link.id=uid();
  if(!link.from) link.from="";
  if(!link.to) link.to="";
  if(!link.type) link.type="Связь";
  if(link.fromRole===undefined) link.fromRole="";
  if(link.toRole===undefined) link.toRole="";
  if(link.note===undefined) link.note="";
  if(!RELATION_STRENGTHS[link.strength]) link.strength="normal";
  const st=RELATION_STYLES[link.type]||RELATION_STYLES["Другое"];
  if(!link.color) link.color=st.color;
  if(!link.pattern) link.pattern=st.pattern;
  return link;
}

function openChapterFromSidebar(ev,id){

function startChapterDrag(ev,id){
  if(ev.button!==0||ev.target.closest("button")) return;
  const list=document.getElementById("chapterList"),el=ev.currentTarget,b=curBook();
  const index=b.chapters.findIndex(c=>c.id===id);
  if(!list||index<0) return;
  const items=[...list.querySelectorAll(".chapter-item")];
  const listRect=list.getBoundingClientRect(),rect=el.getBoundingClientRect();
  chapterDrag={id,index,targetIndex:index,startY:ev.clientY,lastY:ev.clientY,list,el,items,
    itemH:rect.height,topLimit:listRect.top-rect.top,bottomLimit:listRect.bottom-rect.bottom,moved:false};
  el.setPointerCapture(ev.pointerId);
  el.addEventListener("pointermove",moveChapterDrag);
  el.addEventListener("pointerup",finishChapterDrag,{once:true});
  el.addEventListener("pointercancel",cancelChapterDrag,{once:true});
}
function moveChapterDrag(ev){
  if(!chapterDrag) return;
  const d=chapterDrag,raw=ev.clientY-d.startY;
  const dy=Math.max(d.topLimit,Math.min(d.bottomLimit,raw));
  if(Math.abs(dy)>3) d.moved=true;
  d.lastY=ev.clientY;
  d.list.classList.add("sorting");
  d.el.classList.add("dragging");
  d.el.style.transform=`translateY(${dy}px)`;
  const next=Math.max(0,Math.min(d.items.length-1,Math.round((d.index*d.itemH+dy)/d.itemH)));
  d.targetIndex=next;
  d.items.forEach((item,i)=>{
    if(item===d.el) return;
    let shift=0;
    if(next>d.index&&i>d.index&&i<=next) shift=-d.itemH;
    if(next<d.index&&i>=next&&i<d.index) shift=d.itemH;
    item.style.transform=shift?`translateY(${shift}px)`:"";
  });
}
function finishChapterDrag(ev){
  if(!chapterDrag) return;
  const d=chapterDrag;
  d.el.removeEventListener("pointermove",moveChapterDrag);
  cleanupChapterDragStyles();
  if(!d.moved){ chapterDrag=null; return; }
  suppressChapterClick=true; setTimeout(()=>suppressChapterClick=false,0);
  if(d.targetIndex!==d.index){
    const b=curBook();
    const [moved]=b.chapters.splice(d.index,1);
    b.chapters.splice(d.targetIndex,0,moved);
    b.updatedAt=now(); save();
  }
  chapterDrag=null;
  renderSidebar(); if(route.view==="plan") renderMain();
}
function cancelChapterDrag(ev){
  if(chapterDrag){ chapterDrag.el.removeEventListener("pointermove",moveChapterDrag); }
  cleanupChapterDragStyles(); chapterDrag=null;
}
function cleanupChapterDragStyles(){
  if(!chapterDrag) return;
  chapterDrag.list.classList.remove("sorting");
  chapterDrag.items.forEach(item=>{ item.classList.remove("dragging"); item.style.transform=""; });
}

function familyGenerationDelta(fromRole,toRole){
  const parents=new Set(["Мать","Отец","Родитель","Приёмная мать","Приёмный отец","Опекун"]);
  const children=new Set(["Сын","Дочь","Ребёнок","Приёмный ребёнок","Подопечный"]);
  const grandparents=new Set(["Бабушка","Дедушка"]),grandchildren=new Set(["Внук","Внучка"]);
  if(grandparents.has(fromRole)&&grandchildren.has(toRole)) return 2;
  if(grandchildren.has(fromRole)&&grandparents.has(toRole)) return -2;
  if(parents.has(fromRole)&&children.has(toRole)) return 1;
  if(children.has(fromRole)&&parents.has(toRole)) return -1;
  return 0;
}
function applyFamilyTreeLayout(){
  const b=curBook(); if(!b) return;
  const family=validCharacterLinks(b).filter(link=>link.type==="Семья"&&(link.fromRole||link.toRole));
  if(!family.length){ toast(t("familyRolesNeeded")); return; }
  const ranks=new Map((b.characters||[]).map(c=>[c.id,0])),familyIds=new Set();
  family.forEach(link=>{ familyIds.add(link.from); familyIds.add(link.to); });
  for(let pass=0;pass<12;pass++) family.forEach(link=>{
    const delta=familyGenerationDelta(link.fromRole,link.toRole);
    if(delta>0) ranks.set(link.to,Math.max(ranks.get(link.to)||0,(ranks.get(link.from)||0)+delta));
    else if(delta<0) ranks.set(link.from,Math.max(ranks.get(link.from)||0,(ranks.get(link.to)||0)-delta));
  });
  family.forEach(link=>{
    if(familyGenerationDelta(link.fromRole,link.toRole)!==0) return;
    const same=Math.max(ranks.get(link.from)||0,ranks.get(link.to)||0);
    ranks.set(link.from,same); ranks.set(link.to,same);
  });
  const familyCharacters=(b.characters||[]).filter(c=>familyIds.has(c.id));
  const levels=[...new Set(familyCharacters.map(c=>ranks.get(c.id)||0))].sort((a,c)=>a-c);
  levels.forEach((level,row)=>{
    const chars=familyCharacters.filter(c=>(ranks.get(c.id)||0)===level);
    const y=levels.length===1?45:16+(row*(62/(levels.length-1)));
    chars.forEach((c,i)=>{ c.mapX=Number((((i+1)*100)/(chars.length+1)).toFixed(2)); c.mapY=Number(y.toFixed(2)); });
  });
  const others=(b.characters||[]).filter(c=>!familyIds.has(c.id));
  others.forEach((c,i)=>{ c.mapX=Number((((i+1)*100)/(others.length+1)).toFixed(2)); c.mapY=90; });
  b.characterMapZoom=1; b.characterMapPanX=0; b.characterMapPanY=0; b.updatedAt=now(); save(); renderMain(); toast(t("familyLayoutDone"));
}

function genderFromRole(role){

function effectiveCharacterGender(book,id){

function genderedRole(gender,female,male,neutral){ return gender==="female"?female:gender==="male"?male:neutral; }
function reciprocalRelationRole(role,otherGender){
  const exact={
    "Мать":"Ребёнок","Отец":"Ребёнок","Родитель":"Ребёнок","Приёмная мать":"Приёмный ребёнок","Приёмный отец":"Приёмный ребёнок","Опекун":"Подопечный",
    "Сын":"Родитель","Дочь":"Родитель","Ребёнок":"Родитель","Приёмный ребёнок":"Родитель","Подопечный":"Опекун",
    "Наставник":"Ученик","Учитель":"Ученик","Ученик":"Наставник","Покровитель":"Подопечный","Должник":"Кредитор","Кредитор":"Должник",
    "Союзник":"Союзник","Соперник":"Соперник","Враг":"Враг","Партнёр":"Партнёр","Близнец":"Близнец"
  };
  if(["Мать","Отец","Родитель"].includes(role)) return genderedRole(otherGender,"Дочь","Сын","Ребёнок");
  if(["Сын","Дочь","Ребёнок"].includes(role)) return genderedRole(otherGender,"Мать","Отец","Родитель");
  if(["Бабушка","Дедушка"].includes(role)) return genderedRole(otherGender,"Внучка","Внук","Ребёнок");
  if(["Внучка","Внук"].includes(role)) return genderedRole(otherGender,"Бабушка","Дедушка","Родитель");
  if(["Брат","Сестра","Брат / сестра"].includes(role)) return genderedRole(otherGender,"Сестра","Брат","Брат / сестра");
  if(["Муж","Жена","Супруг","Супруга"].includes(role)) return genderedRole(otherGender,"Жена","Муж","Супруг");
  if(["Тётя","Дядя"].includes(role)) return genderedRole(otherGender,"Племянница","Племянник","Ребёнок");
  if(["Племянница","Племянник"].includes(role)) return genderedRole(otherGender,"Тётя","Дядя","Родственник");

  if(["Возлюбленный","Возлюбленная"].includes(role)) return genderedRole(otherGender,"Возлюбленная","Возлюбленный","Партнёр");
  return exact[role]||role||"";
}
function parentChildFromLink(link){
  const parentRoles=new Set(["Мать","Отец","Родитель","Приёмная мать","Приёмный отец","Опекун"]);
  const childRoles=new Set(["Сын","Дочь","Ребёнок","Приёмный ребёнок","Подопечный"]);
  if(parentRoles.has(link.fromRole)&&childRoles.has(link.toRole)) return {parent:link.from,child:link.to};
  if(childRoles.has(link.fromRole)&&parentRoles.has(link.toRole)) return {parent:link.to,child:link.from};
  return null;
}
function derivedSiblingLinks(book){
  const explicit=validCharacterLinks(book),childrenByParent=new Map(),explicitFamilyPairs=new Set();
  explicit.forEach(link=>{
    if(link.type==="Семья") explicitFamilyPairs.add([link.from,link.to].sort().join("|"));
    const pair=link.type==="Семья"?parentChildFromLink(link):null;
    if(!pair) return;
    if(!childrenByParent.has(pair.parent)) childrenByParent.set(pair.parent,new Set());
    childrenByParent.get(pair.parent).add(pair.child);
  });
  const siblingPairs=new Map();
  childrenByParent.forEach((children,parent)=>{
    const ids=[...children];
    for(let i=0;i<ids.length;i++) for(let j=i+1;j<ids.length;j++){
      const pair=[ids[i],ids[j]].sort(),key=pair.join("|");
      if(!explicitFamilyPairs.has(key)&&!siblingPairs.has(key)) siblingPairs.set(key,{ids:pair,parent});
    }
  });
  return [...siblingPairs.values()].map(({ids,parent})=>({
    id:"autoSibling"+ids.join("_"),from:ids[0],to:ids[1],type:"Семья",strength:"normal",derived:true,derivedFrom:parent,
    fromRole:genderedRole(effectiveCharacterGender(book,ids[0]),"Сестра","Брат","Брат / сестра"),
    toRole:genderedRole(effectiveCharacterGender(book,ids[1]),"Сестра","Брат","Брат / сестра"),
    note:t("automaticFamilyNote"),color:RELATION_STYLES["Семья"].color,pattern:RELATION_STYLES["Семья"].pattern
  }));
}
function displayCharacterLinks(b){ return [...validCharacterLinks(b),...derivedSiblingLinks(b)]; }
function mapLinkSvg(book,link,pos){
  const a=pos[link.from],b=pos[link.to]; if(!a||!b) return "";
  const st=relationStyle(link),path=mapCurvePath(a,b);
  const tip=link.note&&link.note.trim()?link.note.trim():`${characterName(book,link.from)} — ${characterName(book,link.to)}: ${labelEnum("relations",link.type||"Связь")}`;
  return `<g data-link-id="${link.id}">
    <path id="mapHit${link.id}" class="map-link-hit" d="${path}"><title>${escapeHtml(tip)}</title></path>
    <path id="mapShadow${link.id}" class="map-line-shadow" d="${path}"></path>
    <path id="mapLine${link.id}" class="map-line" d="${path}"
      style="--thread-color:${st.color};stroke:${st.color};stroke-width:${st.width};opacity:${st.opacity};${st.dash?`stroke-dasharray:${st.dash};`:''}"></path>

}
function mapCurvePath(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.max(1,Math.hypot(dx,dy));
  const bend=Math.min(8,dist*.12);
  const nx=-dy/dist,ny=dx/dist;
  const mx=(a.x+b.x)/2+nx*bend,my=(a.y+b.y)/2+ny*bend;
  return `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;
}
function renderCharacterLinkCard(b,link){

      stroke="${st.color}" stroke-width="${st.width}" stroke-opacity="${st.opacity}" stroke-linecap="round" ${st.dash?`stroke-dasharray="${st.dash}"`:''}></line></svg></span>${strengthIndicator(link,false)}</span>

    let i=0,j=0;

function versionReason(reason){

function versionMoment(ts){ return new Date(ts||now()).toLocaleString(dateLocale(),{day:"2-digit",month:"short",year:"numeric",hour:"2-digit",minute:"2-digit"}); }
function historyCard(doc,index){
  const versions=documentVersions(doc),version=versions[index],first=index===0,currentText=documentText(doc);

  const reason=versionReason(version.reason);

function openDocumentHistory(doc=currentTextDocument()){
  if(!doc) return; historyDocument=doc;
  const versions=documentVersions(doc),current=documentText(doc),last=versions[versions.length-1];
  const hasChanges=!!last&&last.content!==current,currentDiff=hasChanges?textDiff(last.content,current):null,rows=[];
  for(let i=versions.length-1;i>=0;i--) rows.push(historyCard(doc,i));
  const currentState=last?`<div class="history-current"><div class="history-current-main"><strong>${t("currentText")}</strong><span>${hasChanges?t("currentHasChanges"):t("currentMatchesLatest")}</span></div>
    ${hasChanges?`<div class="history-current-side"><div class="ver-delta">${diffDeltaHtml(currentDiff)}</div><button class="btn small" onclick="showDocumentChanges(-1)">${t("compareCurrent")}</button></div>`:""}</div>`:"";
  modal(`<h3>${t("documentHistory")}: ${escapeHtml(doc.title)}</h3><div class="mbody">${currentState}<div class="history-section-title">${t("savedVersions")}</div>
    <div class="history-list">${rows.join("")||`<div class="mmsg">${t("noVersions")}</div>`}</div></div>

}
function showDocumentChanges(index){

  const first=!currentView&&index===0,before=currentView?(versions[versions.length-1]?.content||""):(first?null:versions[index-1].content);
  const diff=first?null:textDiff(before,version.content),sameAsCurrent=!currentView&&version.content===documentText(doc);
  const impact=!currentView&&!sameAsCurrent?textDiff(documentText(doc),version.content):null;
  const title=currentView?t("currentChangesTitle"):(first?`${t("versionTextTitle")} ${versionMoment(version.ts)}`:`${t("versionFrom")} ${versionMoment(version.ts)}`);
  const context=diff&&!currentView?`<div class="diff-note">${t("comparedWithPrevious")}</div>`:"";
  const legend=diff?`<div class="diff-legend">${diff.added?`<span class="add"><i></i>${t("added")}: ${wordAmount(diff.added)}</span>`:""}${diff.removed?`<span class="del"><i></i>${t("removed")}: ${wordAmount(diff.removed)}</span>`:""}${!diff.added&&!diff.removed?`<span class="delta-none">${t("noTextChanges")}</span>`:""}</div>`:"";
  const body=first?`<div class="diff-note">${t("firstVersionHelp")}</div><div class="diff-body">${escapeHtml(version.content)||t("empty")}</div>`:`<div class="diff-body">${renderDiffHtml(diff)}</div>`;
  const note=sameAsCurrent?`<div class="restore-impact">${t("versionAlreadyOpen")}</div>`:(impact?`<div class="restore-impact">${t("restoreImpact")}: <span class="delta-add">${t("willReturn")} ${wordAmount(impact.added)}</span>; <span class="delta-del">${t("willDisappear")} ${wordAmount(impact.removed)}</span>.</div>`:"");
  modal(`<h3>${title}</h3>${context}${legend}<div class="mbody">${body}${note}</div>
    <div class="mfoot"><button class="btn" onclick="openDocumentHistory()">${t("backToList")}</button>${currentView?"":sameAsCurrent?`<button class="btn" disabled>${t("alreadyOpen")}</button>`:`<button class="btn primary" onclick="restoreDocumentVersion(${index})">${t("restoreThisText")}</button>`}</div>`,"history");

}

function applyDialogueDash(body,event){
  if(state.settings.autoDialogueDash===false || event.inputType!=="insertText" || event.data!==" " || event.isComposing) return false;
  const start=body.selectionStart,end=body.selectionEnd;
  if(start!==end || start<2) return false;
  const before=body.value.slice(0,start);
  if(!before.endsWith("  ")) return false;
  const originalValue=body.value,originalPos=start;
  const pairStart=start-2,lineStart=originalValue.lastIndexOf("\n",pairStart-1)+1;
  const linePrefix=originalValue.slice(lineStart,pairStart);
  let replaceStart=pairStart,replacement=" — ";
  if(/^\s*$/.test(linePrefix)){ replaceStart=lineStart; replacement="— "; }
  else if(/[\s—–-]$/.test(linePrefix)) return false;
  const nextValue=originalValue.slice(0,replaceStart)+replacement+originalValue.slice(start);
  const nextPos=replaceStart+replacement.length;
  body.value=nextValue;
  body.selectionStart=body.selectionEnd=nextPos;
  dialogueDashUndo.push({bookId:route.bookId,chapterId:route.itemId,beforeValue:originalValue,beforePos:originalPos,afterValue:nextValue,afterPos:nextPos});
  if(dialogueDashUndo.length>100) dialogueDashUndo.shift();
  dialogueDashRedo=[];
  return true;
}
function handleDialogueDashHistory(body,event){
  if(!(event.ctrlKey||event.metaKey) || event.altKey) return false;
  const key=event.key.toLowerCase(),redo=key==="y"||(key==="z"&&event.shiftKey),undo=key==="z"&&!event.shiftKey;
  const stack=redo?dialogueDashRedo:dialogueDashUndo;
  if(!redo&&!undo) return false;
  for(let i=stack.length-1;i>=0;i--){
    const x=stack[i],expected=redo?x.beforeValue:x.afterValue;
    if(x.bookId!==route.bookId || x.chapterId!==route.itemId || body.value!==expected) continue;
    stack.splice(i,1);
    if(redo){ body.value=x.afterValue; body.selectionStart=body.selectionEnd=x.afterPos; dialogueDashUndo.push(x); }
    else{ body.value=x.beforeValue; body.selectionStart=body.selectionEnd=x.beforePos; dialogueDashRedo.push(x); }
    return true;
  }
  return false;
}

function loreWordCount(item){ return countWords([item&&item.summary,item&&item.details,item&&item.links].filter(Boolean).join(" ")); }
function renderLoreInline(value){
  let safe=escapeHtml(String(value||""));
  safe=safe.replace(/`([^`\n]+)`/g,"<code>$1</code>");
  safe=safe.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>");
  safe=safe.replace(/__([^_\n]+)__/g,"<strong>$1</strong>");
  safe=safe.replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>");
  safe=safe.replace(/(^|[^_])_([^_\n]+)_(?!_)/g,"$1<em>$2</em>");
  return safe;
}
function renderLoreMarkdown(value){
  const lines=String(value||"").replace(/\r\n?/g,"\n").split("\n"),html=[],headings=[];
  let paragraph=[],listType="";
  const flushParagraph=()=>{ if(paragraph.length){ html.push(`<p>${paragraph.join("<br>")}</p>`); paragraph=[]; } };
  const closeList=()=>{ if(listType){ html.push(`</${listType}>`); listType=""; } };
  const flushAll=()=>{ flushParagraph(); closeList(); };
  lines.forEach(line=>{
    const trimmed=line.trim();
    if(!trimmed){ flushAll(); return; }
    const heading=trimmed.match(/^(#{1,4})\s+(.+)$/);
    if(heading){
      flushAll();
      const level=heading[1].length,id=`lore-heading-${headings.length+1}`;
      const plain=heading[2].replace(/[*_`]/g,"").trim();
      headings.push({id,level,text:plain});
      html.push(`<h${level} id="${id}">${renderLoreInline(heading[2])}</h${level}>`);
      return;
    }
    if(/^(?:-{3,}|\*{3,}|_{3,})$/.test(trimmed)){ flushAll(); html.push("<hr>"); return; }
    const unordered=trimmed.match(/^[-*+]\s+(.+)$/),ordered=trimmed.match(/^\d+[.)]\s+(.+)$/);
    if(unordered||ordered){
      flushParagraph();
      const nextType=ordered?"ol":"ul";
      if(listType!==nextType){ closeList(); listType=nextType; html.push(`<${listType}>`); }
      html.push(`<li>${renderLoreInline((ordered||unordered)[1])}</li>`);
      return;
    }
    if(trimmed.startsWith(">")){
      flushAll(); html.push(`<blockquote>${renderLoreInline(trimmed.replace(/^>\s?/,""))}</blockquote>`); return;
    }
    closeList(); paragraph.push(renderLoreInline(trimmed));
  });
  flushAll();
  return {html:html.join(""),headings};
}

function applyLoreFormat(kind){
  const el=document.getElementById("loreDetails"); if(!el) return;
  const start=el.selectionStart,end=el.selectionEnd,value=el.value,selected=value.slice(start,end);
  if(kind==="bold"||kind==="italic"){
    const marker=kind==="bold"?"**":"*",sample=selected||(lang()==="ru"?"текст":"text");
    const inserted=marker+sample+marker,next=value.slice(0,start)+inserted+value.slice(end);
    const selStart=start+marker.length,selEnd=selStart+sample.length;
    setLoreTextareaValue(el,next,selStart,selEnd); return;
  }
  if(kind==="divider"){
    const before=start>0&&!value.slice(0,start).endsWith("\n")?"\n":"",after=end<value.length&&!value.slice(end).startsWith("\n")?"\n":"";
    const inserted=`${before}---${after}`;
    setLoreTextareaValue(el,value.slice(0,start)+inserted+value.slice(end),start+inserted.length,start+inserted.length); return;
  }
  const lineStart=value.lastIndexOf("\n",start-1)+1,lineEndRaw=value.indexOf("\n",end),lineEnd=lineEndRaw<0?value.length:lineEndRaw;
  const block=value.slice(lineStart,lineEnd),prefix=kind==="heading"?"## ":"- ";

  setLoreTextareaValue(el,value.slice(0,lineStart)+changed+value.slice(lineEnd),lineStart,lineStart+changed.length);
}

let currentAppVersion="—",latestUpdateUrl="",latestUpdateVersion="",updateAvailable=false,backgroundUpdateStarted=false;
function applyUpdateResult(result){
  if(!apiOk(result)) return false;
  currentAppVersion=String(result.current_version||currentAppVersion);
  latestUpdateUrl=String(result.url||"");
  latestUpdateVersion=String(result.latest_version||"");
  updateAvailable=!!result.update_available&&!!latestUpdateUrl;
  renderTopbar();
  return true;
}
function syncUpdateSettingsUi(){
  const version=document.getElementById("appVersionValue"),status=document.getElementById("updateStatus"),download=document.getElementById("downloadUpdateButton");
  if(version) version.textContent=currentAppVersion;
  if(updateAvailable){
    if(status) status.textContent=`${t("updateAvailable")} ${latestUpdateVersion}`.trim();
    if(download) download.hidden=false;
  }
}
function startBackgroundUpdateCheck(){
  if(backgroundUpdateStarted||state.settings.automaticUpdateChecks===false) return;
  backgroundUpdateStarted=true;
  setTimeout(backgroundCheckForUpdates,2500);
}
async function backgroundCheckForUpdates(){
  const a=api(); if(!a||!a.check_for_updates) return;
  try{
    const result=await a.check_for_updates(lang(),false);
    if(applyUpdateResult(result)) syncUpdateSettingsUi();
  }catch(e){}
}
async function refreshAppInfo(){
  const el=document.getElementById("appVersionValue"),a=api();
  if(!el) return;
  if(a&&a.app_info){
    try{ const info=await a.app_info(); if(apiOk(info)&&info.version) currentAppVersion=String(info.version); }catch(e){}
  }
  el.textContent=currentAppVersion; syncUpdateSettingsUi();
}
async function checkForUpdates(){
  const a=api(),button=document.getElementById("checkUpdatesButton"),status=document.getElementById("updateStatus"),download=document.getElementById("downloadUpdateButton");
  if(!button||!status) return;
  button.disabled=true; status.textContent=t("checkingUpdates"); if(download) download.hidden=true;
  try{
    if(!a||!a.check_for_updates) throw new Error(t("updateCheckFail"));
    const result=await a.check_for_updates(lang(),true);
    if(!apiOk(result)) throw new Error(apiError(result,t("updateCheckFail")));
    applyUpdateResult(result);
    if(updateAvailable) syncUpdateSettingsUi();
    else status.textContent=t("currentVersion");
  }catch(e){ status.textContent=e&&e.message?e.message:t("updateCheckFail"); }
  finally{ button.disabled=false; }
}
async function openUpdateDownload(){
  if(!latestUpdateUrl) return;
  const a=api();
  try{
    if(a&&a.open_external){ const result=await a.open_external(latestUpdateUrl,lang()); if(apiOk(result)) return; throw new Error(apiError(result,t("updateCheckFail"))); }
    window.open(latestUpdateUrl,"_blank","noopener");
  }catch(e){ openInfo(t("failTitle"),e&&e.message?e.message:t("updateCheckFail")); }
}

function openTrash(){
  ensureData();
  const rows=[
    ...state.trash.books.map((x,i)=>trashRow("books",i,t("book"),titleOrFallback(x.data.title),t("withChaptersCharacters"),x.deletedAt)),
    ...state.trash.chapters.map((x,i)=>trashRow("chapters",i,t("chapter"),titleOrFallback(x.data.title),`${t("fromBook")} «${titleOrFallback(x.bookTitle)}»`,x.deletedAt)),
    ...state.trash.characters.map((x,i)=>trashRow("characters",i,characterFallback(),nameOrFallback(x.data.name),`${t("fromBook")} «${titleOrFallback(x.bookTitle)}»`,x.deletedAt)),
    ...state.trash.lore.map((x,i)=>trashRow("lore",i,labelEnum("lore",x.data.type||"Лор"),titleOrFallback(x.data.title),`${t("fromBook")} «${titleOrFallback(x.bookTitle)}»`,x.deletedAt))
  ].join("");
  const total=trashCount();
  modal(`<h3>${t("trash")}</h3>
    <div class="mbody trash-list">
      ${rows||`<div class="search-empty">${t("trashEmpty")}</div>`}

      ${total?`<button class="btn danger" onclick="emptyTrash()">${icon('trash',16)} ${t("clear")}</button>`:""}
      <button class="btn primary" onclick="closeModal()">${t("done")}</button>
    </div>`,"wide");
}
function trashRow(type,idx,kind,title,sub,deletedAt){
  const when=deletedAt?new Date(deletedAt).toLocaleString(dateLocale(),{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  return `<div class="trash-card">
    <div class="trash-head"><span class="trash-kind">${kind}</span><span class="trash-title">${escapeHtml(title)}</span></div>
    <div class="trash-sub">${escapeHtml(sub)}${when?` · ${when}`:""}</div>
    <div class="trash-actions">
      <button class="btn small primary" onclick="restoreTrash('${type}',${idx})">${icon('restore',15)} ${t("restore")}</button>
      <button class="btn small ghost" onclick="purgeTrash('${type}',${idx})">${icon('x',15)} ${t("deleteForever")}</button>
    </div>
  </div>`;
}
function ensureUniqueBookId(book){
  if(!getBook(book.id)) return book;
  book.id=uid();
  return book;
}
function ensureUniqueItemId(list,item){
  if(!list.some(x=>x.id===item.id)) return item;
  item.id=uid();
  return item;
}
function fallbackBookForTrash(title){
  const b={id:uid(),title:title||t("restoredBook"),createdAt:now(),updatedAt:now(),
    author:"",previewFormat:"standard",year:"",era:"",place:"",synopsis:"",planText:"",planVersions:[],chapters:[],characters:[],characterLinks:[],lore:[]};
  state.books.unshift(b);
  return b;
}
function restoreTrash(type,idx){
  ensureData();
  const item=state.trash[type]&&state.trash[type][idx]; if(!item) return;
  if(type==="books"){
    const book=ensureUniqueBookId(cloneData(item.data));
    book.updatedAt=now(); state.books.unshift(book);
  }
  if(type==="chapters"){
    let b=getBook(item.bookId) || fallbackBookForTrash(item.bookTitle||t("restoredBook"));
    const ch=ensureUniqueItemId(b.chapters,normalizeChapter(cloneData(item.data)));
    ch.updatedAt=now(); b.chapters.push(ch); b.updatedAt=now();
  }
  if(type==="characters"){
    let b=getBook(item.bookId) || fallbackBookForTrash(item.bookTitle||t("restoredBook"));
    const c=ensureUniqueItemId(b.characters,normalizeCharacter(cloneData(item.data)));
    b.characters.push(c); b.updatedAt=now();
  }
  if(type==="lore"){
    let b=getBook(item.bookId) || fallbackBookForTrash(item.bookTitle||t("restoredBook"));
    b.lore=Array.isArray(b.lore)?b.lore:[];
    const lore=ensureUniqueItemId(b.lore,normalizeLore(cloneData(item.data)));
    b.lore.unshift(lore); b.updatedAt=now();
  }
  state.trash[type].splice(idx,1);
  save(); toast(t("restored")); openTrash(); render();
}
async function purgeTrash(type,idx){
  ensureData();
  const item=state.trash[type]&&state.trash[type][idx]; if(!item) return;
  if(!await openConfirm({title:t("deleteForeverTitle"),message:t("deleteForeverMsg"),ok:t("delete"),danger:true})) return;
  state.trash[type].splice(idx,1); save(); openTrash(); renderTopbar();
}
async function emptyTrash(){
  if(!await openConfirm({title:t("emptyTrashTitle"),message:t("emptyTrashMsg"),ok:t("clear"),danger:true})) return;
  state.trash={books:[],chapters:[],characters:[],lore:[]}; save(); openTrash(); renderTopbar();
}

function openSearch(){

    </div>
    <div class="mbody search-results" id="searchResults"></div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">${t("close")}</button></div>`,"wide");
  const input=document.getElementById("searchInput");
  input.focus();
  const run=()=>renderSearchResults(input.value);
  input.addEventListener("input",run);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const first=document.querySelector(".search-result"); if(first) first.click(); } });
  renderSearchResults("");
}
function renderSearchResults(query){
  const box=document.getElementById("searchResults"); if(!box) return;
  const q=(query||"").trim();
  if(q.length<2){ box.innerHTML=`<div class="search-empty">${t("searchMin")}</div>`; return; }
  const tokens=q.toLocaleLowerCase(dateLocale()).split(/\s+/).filter(Boolean);
  const results=collectSearchItems().map(item=>{
    const hay=(item.title+"\n"+item.bookTitle+"\n"+item.kind+"\n"+item.text).toLocaleLowerCase(dateLocale());
    if(!tokens.every(t=>hay.includes(t))) return null;
    const titleHay=(item.title+"\n"+item.bookTitle).toLocaleLowerCase(dateLocale());
    const score=tokens.reduce((s,t)=>s+(titleHay.includes(t)?10:1),0);
    return {...item,score,snippet:makeSnippet(item.title+"\n"+item.text,tokens)};
  }).filter(Boolean).sort((a,b)=>b.score-a.score||a.kind.localeCompare(b.kind,dateLocale())).slice(0,80);
  if(!results.length){ box.innerHTML=`<div class="search-empty">${t("searchNothing")}</div>`; return; }
  box.innerHTML=results.map(r=>`<div class="search-result" onclick="openSearchResult('${r.bookId}','${r.view}','${r.itemId||''}')">
    <div class="sr-top"><span class="sr-kind">${escapeHtml(r.kind)}</span><span class="sr-title">${escapeHtml(r.title)}</span></div>
    <div class="sr-book">${escapeHtml(r.bookTitle)}</div>
    <div class="sr-snippet">${highlightText(r.snippet,tokens)}</div>
  </div>`).join("");
  enhanceInteractiveControls(box);
}
function collectSearchItems(){
  const items=[];
  state.books.forEach(b=>{
    const bookTitle=titleOrFallback(b.title);
    items.push({
      bookId:b.id,view:"overview",itemId:"",kind:t("book"),title:bookTitle,bookTitle,
      text:[b.title,b.year,b.era,b.place,b.synopsis,b.planText].filter(Boolean).join("\n")
    });
    (b.chapters||[]).forEach((c,i)=>items.push({
      bookId:b.id,view:"chapter",itemId:c.id,kind:`${t("chapter")} ${i+1}`,title:titleOrFallback(c.title),bookTitle,
      text:[c.title,c.planText,c.planSummary,c.planNotes,c.content].filter(Boolean).join("\n")
    }));
    (b.characters||[]).forEach(c=>items.push({
      bookId:b.id,view:"character",itemId:c.id,kind:t("charactersGroup").slice(0,-1),title:nameOrFallback(c.name),bookTitle,
      text:[c.name,c.role,c.age,c.appearance,c.personality,c.background,c.goals,c.relationships,c.notes,c.arcText].filter(Boolean).join("\n")
    }));
    displayCharacterLinks(b).forEach(link=>items.push({
      bookId:b.id,view:"characterMap",itemId:"",kind:t("link"),title:`${characterName(b,link.from)} — ${characterName(b,link.to)}`,bookTitle,
      text:[characterName(b,link.from),characterName(b,link.to),link.type,link.note].filter(Boolean).join("\n")
    }));
    (b.lore||[]).forEach(item=>items.push({
      bookId:b.id,view:"lore",itemId:item.id,kind:labelEnum("lore",item.type||"Лор"),title:titleOrFallback(item.title),bookTitle,
      text:[item.title,item.type,item.summary,item.details,item.links].filter(Boolean).join("\n")
    }));
  });
  return items;
}
function makeSnippet(text,tokens){
  const src=(text||"").replace(/\s+/g," ").trim();
  if(!src) return "";
  const lower=src.toLocaleLowerCase(dateLocale());
  let pos=-1;
  tokens.forEach(t=>{ const i=lower.indexOf(t); if(i>=0&&(pos<0||i<pos)) pos=i; });
  if(pos<0) pos=0;
  const start=Math.max(0,pos-70),end=Math.min(src.length,pos+170);
  return `${start>0?"...":""}${src.slice(start,end)}${end<src.length?"...":""}`;
}
function highlightText(text,tokens){
  const uniq=[...new Set(tokens)].filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!uniq.length) return escapeHtml(text);
  const rx=new RegExp("("+uniq.map(escapeRegExp).join("|")+")","gi");
  let out="",last=0;
  (text||"").replace(rx,(m,...args)=>{
    const offset=args[args.length-2];
    out+=escapeHtml(text.slice(last,offset))+`<mark>${escapeHtml(m)}</mark>`;
    last=offset+m.length;
    return m;
  });
  out+=escapeHtml((text||"").slice(last));
  return out;
}
function escapeRegExp(s){ return (s||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function openSearchResult(bookId,view,itemId){

}
