/* ============ ПРЕДПРОСМОТР ============ */
function previewFormatOptions(current){
  return `<option value="compact" ${current==="compact"?'selected':''}>${t("formatCompact")}</option>
    <option value="standard" ${current==="standard"?'selected':''}>${t("formatStandard")}</option>
    <option value="a5" ${current==="a5"?'selected':''}>${t("formatA5")}</option>`;
}
function previewPageCountLabel(count){
  return isEn()?`${fmt(count)} ${count===1?"text page":"text pages"} ${t("titlePageShort")}`:`${fmt(count)} ${t("textPages")} ${t("titlePageShort")}`;
}
function previewFormatOf(book){ return BOOK_FORMATS[book.previewFormat]||BOOK_FORMATS.standard; }
function applyPreviewSheetFormat(sheet,format){
  sheet.style.setProperty("--pv-width",`${format.width}mm`);
  sheet.style.setProperty("--pv-height",`${format.height}mm`);
  sheet.style.setProperty("--pv-top",`${format.top}mm`);
  sheet.style.setProperty("--pv-outer",`${format.outer}mm`);
  sheet.style.setProperty("--pv-bottom",`${format.bottom}mm`);
  sheet.style.setProperty("--pv-inner",`${format.inner}mm`);
  sheet.style.setProperty("--pv-font",`${format.font}pt`);
  sheet.style.setProperty("--pv-leading",String(format.leading));
}
function createPreviewSheet(format,pageNumber=null,extraClass=""){
  const sheet=document.createElement("div"); sheet.className=`pv-sheet ${extraClass}`.trim(); applyPreviewSheetFormat(sheet,format);
  const page=document.createElement("div"); page.className=`pv-page${pageNumber!==null&&pageNumber%2===0?" pv-even":""}`;
  const body=document.createElement("div"); body.className="pv-page-body"; page.appendChild(body);
  if(pageNumber!==null){ const number=document.createElement("div"); number.className="pv-page-number"; number.textContent=fmt(pageNumber); page.appendChild(number); }
  sheet.appendChild(page); return {sheet,page,body};
}
function previewOverflows(body){ return body.scrollHeight>body.clientHeight+1; }
function fitPreviewParagraph(body,text,continued=false){
  const source=String(text||"").replace(/\s+/g," ").trim();
  if(!source) return {placed:true,remainder:""};
  const hadParagraph=!!body.querySelector("p"),words=source.split(" "),p=document.createElement("p");
  if(continued) p.className="pv-continued";
  p.textContent=source; body.appendChild(p);
  if(!previewOverflows(body)) return {placed:true,remainder:""};
  let low=1,high=words.length,best=0;
  while(low<=high){
    const mid=Math.floor((low+high)/2); p.textContent=words.slice(0,mid).join(" ");
    if(previewOverflows(body)) high=mid-1; else{ best=mid; low=mid+1; }
  }
  if(best===0&&!hadParagraph){
    low=1; high=source.length;
    while(low<=high){
      const mid=Math.floor((low+high)/2); p.textContent=source.slice(0,mid);
      if(previewOverflows(body)) high=mid-1; else{ best=mid; low=mid+1; }
    }
    if(best>0){ p.textContent=source.slice(0,best); return {placed:true,remainder:source.slice(best).trimStart()}; }
  }
  if(best===0){ p.remove(); return {placed:false,remainder:source}; }
  p.textContent=words.slice(0,best).join(" ");
  return {placed:true,remainder:words.slice(best).join(" ")};
}
function previewChapterHeading(chapter,index){
  const head=document.createElement("div"); head.className="pv-chapter-head";
  const number=document.createElement("div"); number.className="pv-cnum"; number.textContent=`${t("chapterUpper")} ${index+1}`;
  const title=document.createElement("h2"); title.textContent=chapter.title||`${t("chapter")} ${index+1}`;
  head.append(number,title); return head;
}
function renderPreviewPages(){
  const book=curBook(),root=document.getElementById("pvPages"),measure=document.getElementById("pvMeasure");
  if(!book||!root||!measure) return;
  const format=previewFormatOf(book),sheets=[]; measure.innerHTML="";
  const title=createPreviewSheet(format,null,"pv-title-sheet"); title.page.classList.add("pv-title-page");
  if((book.author||"").trim()){ const author=document.createElement("div"); author.className="pv-author"; author.textContent=book.author.trim(); title.body.appendChild(author); }
  const bookTitle=document.createElement("div"); bookTitle.className="pv-book-title"; bookTitle.textContent=titleOrFallback(book.title); title.body.appendChild(bookTitle);
  sheets.push(title.sheet);
  let pageNumber=0;
  const newTextPage=()=>{ pageNumber+=1; const made=createPreviewSheet(format,pageNumber); measure.appendChild(made.sheet); sheets.push(made.sheet); return made; };
  (book.chapters||[]).forEach((chapter,index)=>{
    let current=newTextPage(); current.body.appendChild(previewChapterHeading(chapter,index));
    const paragraphs=String(chapter.content||"").replace(/\r\n/g,"\n").replace(/\r/g,"\n").split(/\n+/).map(value=>value.trim()).filter(Boolean);
    if(!paragraphs.length){ const empty=document.createElement("p"); empty.className="pv-empty"; empty.textContent=t("emptyChapter"); current.body.appendChild(empty); return; }
    paragraphs.forEach(paragraph=>{
      let remainder=paragraph,continued=false,guard=0;
      while(remainder&&guard++<1000){
        const fitted=fitPreviewParagraph(current.body,remainder,continued);
        if(!fitted.placed){ current=newTextPage(); continue; }
        remainder=fitted.remainder;
        if(remainder){ current=newTextPage(); continued=true; }
      }
    });
  });
  root.innerHTML=""; root.className=`pv-pages ${state.settings.previewView==="single"?"single":"spread"}`;
  root.style.setProperty("--pv-zoom",String(state.settings.previewZoom||1));
  sheets.forEach(sheet=>root.appendChild(sheet)); measure.innerHTML="";
  const count=document.getElementById("pvCount"),zoom=document.getElementById("pvZoomValue");
  if(count) count.textContent=previewPageCountLabel(pageNumber);
  if(zoom) zoom.textContent=`${Math.round((state.settings.previewZoom||1)*100)}%`;
}
function setPreviewFormat(value){
  const book=curBook(); if(!book||!BOOK_FORMATS[value]) return;
  book.previewFormat=value; book.updatedAt=now(); save(); renderPreviewPages();
}
function setPreviewView(value){
  state.settings.previewView=value==="single"?"single":"spread"; save();
  const root=document.getElementById("pvPages"); if(root) root.className=`pv-pages ${state.settings.previewView}`;
}
function setPreviewZoom(direction){
  const current=Number(state.settings.previewZoom)||1;
  state.settings.previewZoom=Math.min(PREVIEW_MAX_ZOOM,Math.max(PREVIEW_MIN_ZOOM,Number((current+direction*PREVIEW_ZOOM_STEP).toFixed(2))));
  save(); const root=document.getElementById("pvPages"),value=document.getElementById("pvZoomValue");
  if(root) root.style.setProperty("--pv-zoom",String(state.settings.previewZoom));
  if(value) value.textContent=`${Math.round(state.settings.previewZoom*100)}%`;
}
function openPreview(){
  snapshotCurrent(); const b=curBook();
  const format=BOOK_FORMATS[b.previewFormat]?b.previewFormat:"standard",view=state.settings.previewView==="single"?"single":"spread";
  const html=`<div class="pv-toolbar">
    <div class="pv-tool"><label for="pvFormat">${t("layoutFormat")}</label><select id="pvFormat" onchange="setPreviewFormat(this.value)">${previewFormatOptions(format)}</select></div>
    <div class="pv-tool"><label for="pvView">${t("layoutView")}</label><select id="pvView" onchange="setPreviewView(this.value)"><option value="single" ${view==="single"?'selected':''}>${t("viewSingle")}</option><option value="spread" ${view==="spread"?'selected':''}>${t("viewSpread")}</option></select></div>
    <div class="pv-zoom"><button type="button" title="${t("zoomOut")}" aria-label="${t("zoomOut")}" onclick="setPreviewZoom(-1)">−</button><span class="pv-zoom-value" id="pvZoomValue">100%</span><button type="button" title="${t("zoomIn")}" aria-label="${t("zoomIn")}" onclick="setPreviewZoom(1)">+</button></div>
    <span class="pv-count" id="pvCount"></span>
    <button class="btn small primary" onclick="closePreview()">${icon('x',16)} ${t("close")}</button>
  </div><div class="pv-pages ${view}" id="pvPages"></div><div class="pv-measure" id="pvMeasure"></div>`;
  const pv=document.getElementById("preview"); pv.innerHTML=html; pv.classList.remove("hidden");
  const fontsReady=document.fonts&&document.fonts.ready?document.fonts.ready:Promise.resolve();
  fontsReady.then(()=>requestAnimationFrame(renderPreviewPages));
}
function closePreview(){ const pv=document.getElementById("preview"); pv.classList.add("hidden"); pv.innerHTML=""; }

async function exportBackup(){
  const a=api(); if(!a) return;
  snapshotCurrent();
  const res=await a.export_backup(JSON.stringify(state,null,1),lang());
  if(apiOk(res)) toast(t("backupSaved"));

async function importBackup(){
  const a=api(); if(!a) return;
  const imported=await a.import_backup(lang());
  if(!imported||(typeof imported==="object"&&imported.cancelled)) return;
  if(typeof imported==="object"&&!apiOk(imported)) return openInfo(t("failTitle"),apiError(imported,t("backupFail")));
  const raw=typeof imported==="string"?imported:imported.data; if(!raw) return;
  let d; try{ d=JSON.parse(raw); if(!d.books) throw 0; }catch(e){ return openInfo(t("failTitle"),t("badBackup")); }
  if(!await openConfirm({title:t("replaceBooks"),message:t("replaceBooksMsg"),ok:t("replace"),danger:false})) return;
  snapshotCurrent();
  const backup=await a.backup_state(JSON.stringify(state,null,1),t("beforeImport"),lang());
  if(!apiOk(backup)) return openInfo(t("failTitle"),apiError(backup,t("oldBackupFail")));
  state=d; ensureData(); if(!state.settings) state.settings={fontSize:19,theme:"light",accent:DEFAULT_ACCENT};
  if(!state.settings.accent) state.settings.accent=DEFAULT_ACCENT;
  if(state.settings.lang!=="en") state.settings.lang="ru";
  if(state.settings.autoDialogueDash!==false) state.settings.autoDialogueDash=true;
  if(state.settings.automaticUpdateChecks!==false) state.settings.automaticUpdateChecks=true;
  if(typeof state.settings.defaultAuthor!=="string"){
    const known=[...new Set(state.books.map(book=>String(book.author||"").trim()).filter(Boolean))];
    state.settings.defaultAuthor=known.length===1?known[0]:"";
  }
  if(!["single","spread"].includes(state.settings.previewView)) state.settings.previewView="spread";
  state.settings.previewZoom=Math.min(PREVIEW_MAX_ZOOM,Math.max(PREVIEW_MIN_ZOOM,Number(state.settings.previewZoom)||1));
  document.documentElement.lang=state.settings.lang;
  applyTheme(); save(); goHome(); toast(t("backupLoaded"));
}

let modalReturnFocus=null,activeModalCancel=null;
function enhanceInteractiveControls(root){
  if(!root||!root.querySelectorAll) return;
  root.querySelectorAll("[onclick]").forEach(el=>{
    if(el.matches("button,input,textarea,select,a[href]")||el.hasAttribute("data-no-keyboard")) return;
    if(!el.hasAttribute("role")) el.setAttribute("role","button");
    if(!el.hasAttribute("tabindex")) el.tabIndex=0;
    if(el.dataset.keyboardReady) return;
    el.dataset.keyboardReady="1";
    el.addEventListener("keydown",e=>{
      if(e.target!==el) return;
      if(e.key!=="Enter"&&e.key!==" ") return;
      if(e.key===" ") e.preventDefault();
      e.stopPropagation(); el.click();
    });
  });
}
function modal(html,cls){
  if(!document.querySelector(".modal")) modalReturnFocus=document.activeElement;
  activeModalCancel=null;
  document.getElementById("modalRoot").innerHTML=`<div class="modal-back" id="mback"><div class="modal ${cls||''}" role="dialog" aria-modal="true" tabindex="-1">${html}</div></div>`;
  const dialog=document.querySelector(".modal");
  const heading=dialog&&dialog.querySelector("h3");
  if(heading){ heading.id="modalTitle"; dialog.setAttribute("aria-labelledby",heading.id); }
  enhanceInteractiveControls(dialog);
  queueMicrotask(()=>{ const focusable=dialog&&dialog.querySelector("button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),[tabindex='0']"); (focusable||dialog)?.focus(); });
}
function closeModal(){
  document.getElementById("modalRoot").innerHTML=""; activeModalCancel=null;
  const restore=modalReturnFocus; modalReturnFocus=null;
  if(restore&&document.contains(restore)&&restore.focus) restore.focus();
}
function requestCloseModal(){ if(activeModalCancel) activeModalCancel(); else closeModal(); }
function openInput({title,label,value="",placeholder="",ok=t("done")}){
  return new Promise(res=>{
    modal(`<h3>${escapeHtml(title)}</h3><div class="mpad">${label?`<label class="flbl">${escapeHtml(label)}</label>`:''}
      <input class="finput" id="mInput" value="${escapeAttr(value)}" placeholder="${escapeAttr(placeholder)}"></div>
      <div class="mfoot"><button class="btn" id="mCancel">${t("cancel")}</button><button class="btn primary" id="mOk">${escapeHtml(ok)}</button></div>`);
    const inp=document.getElementById("mInput"); inp.focus(); inp.select();
    const done=v=>{ closeModal(); res(v); };
    activeModalCancel=()=>done(null);
    document.getElementById("mOk").onclick=()=>done(inp.value);
    document.getElementById("mCancel").onclick=()=>done(null);
    document.getElementById("mback").onclick=e=>{ if(e.target.id==="mback") done(null); };
    inp.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();done(inp.value);} if(e.key==="Escape")done(null); };
  });
}
function openConfirm({title,message,ok=t("delete"),danger=true}){
  return new Promise(res=>{
    modal(`<h3>${escapeHtml(title)}</h3><div class="mpad mmsg">${escapeHtml(message||"")}</div>
      <div class="mfoot"><button class="btn" id="mCancel">${t("cancel")}</button><button class="btn ${danger?'danger':'primary'}" id="mOk">${escapeHtml(ok)}</button></div>`);
    const done=v=>{ closeModal(); res(v); };
    activeModalCancel=()=>done(false);
    document.getElementById("mOk").onclick=()=>done(true);
    document.getElementById("mCancel").onclick=()=>done(false);
    document.getElementById("mback").onclick=e=>{ if(e.target.id==="mback") done(false); };
  });
}
function openInfo(title,message){
  return new Promise(res=>{
    modal(`<h3>${escapeHtml(title)}</h3><div class="mpad mmsg">${escapeHtml(message)}</div>
      <div class="mfoot"><button class="btn primary" id="mOk">${t("understand")}</button></div>`);
    const done=()=>{ closeModal(); res(); };
    activeModalCancel=done;
    document.getElementById("mOk").onclick=done;
    document.getElementById("mback").onclick=e=>{ if(e.target.id==="mback") done(); };
  });
}

/* ============ ТОСТ / УТИЛИТЫ ============ */
let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); t.innerHTML=`${icon('clock',15)} ${escapeHtml(msg)}`; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2000); }
function escapeHtml(s){ return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }
function escapeAttr(s){ return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

document.addEventListener("keydown",e=>{
  const dialog=document.querySelector(".modal");
  if(e.key==="Tab"&&dialog){
    const focusable=[...dialog.querySelectorAll("button:not(:disabled),input:not(:disabled),textarea:not(:disabled),select:not(:disabled),a[href],[tabindex='0']")].filter(el=>el.offsetParent!==null);
    if(!focusable.length){ e.preventDefault(); dialog.focus(); return; }
    const first=focusable[0],last=focusable[focusable.length-1];
    if(e.shiftKey&&document.activeElement===first){ e.preventDefault(); last.focus(); return; }
    if(!e.shiftKey&&document.activeElement===last){ e.preventDefault(); first.focus(); return; }
  }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"){ e.preventDefault(); openSearch(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"&&currentTextDocument()){ e.preventDefault(); manualSnapshot(); }
  if(e.key==="Escape"){
    if(closeTextContextMenu()) return;
    if(document.querySelector(".modal")){ e.preventDefault(); requestCloseModal(); return; }
    if(!document.getElementById("preview").classList.contains("hidden")){ closePreview(); return; }
  }
});
document.addEventListener("contextmenu",e=>{
  const target=selectableTextTarget(e.target);
  if(!target) return;
  e.preventDefault();
  showTextContextMenu(e,target);
});
document.addEventListener("pointerdown",e=>{
  const menu=document.querySelector(".text-context-menu");
  if(menu&&!menu.contains(e.target)) closeTextContextMenu();
});
document.addEventListener("scroll",closeTextContextMenu,true);
window.addEventListener("blur",closeTextContextMenu);
window.addEventListener("resize",()=>{ closeTextContextMenu(); fitChapterBody(document.getElementById("edBody")); });
window.addEventListener("beforeunload",()=>{ flushPendingSave(); });
window.addEventListener("pagehide",()=>{ flushPendingSave(); });
document.addEventListener("visibilitychange",()=>{ if(document.visibilityState==="hidden") flushPendingSave(); });

/* ============ СТАРТ ============ */
if(window.pywebview&&window.pywebview.api){ boot(); }
else { window.addEventListener("pywebviewready",boot); }
setTimeout(()=>{ const h=document.getElementById("homeInner"); if(h&&!h.innerHTML){ applyTheme(); render(); } },1500);
