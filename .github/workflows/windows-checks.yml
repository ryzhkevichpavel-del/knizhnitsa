name: Windows checks

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  checks:
    name: Tests and Windows build smoke
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app\requirements.txt

      - name: Check Python syntax
        run: python -m compileall -q app

      - name: Run unit tests
        run: python -m unittest discover -s app\tests -v

      - name: Check UI JavaScript syntax
        shell: pwsh
        run: |
          $tmp = Join-Path $env:RUNNER_TEMP "knizhnitsa-ui-check.js"
          $html = Get-Content -Raw app\ui.html
          $matches = [regex]::Matches($html, '(?s)<script>(.*?)</script>')
          $js = ($matches | ForEach-Object { $_.Groups[1].Value }) -join "`n"
          Set-Content -LiteralPath $tmp -Value $js -Encoding UTF8
          node --check $tmp

      - name: Build Windows application
        shell: pwsh
        working-directory: app
        run: |
          python -m PyInstaller --noconfirm --clean .\Книжница.spec
          if (-not (Test-Path -LiteralPath ".\dist\Книжница\Книжница.exe")) {
            throw "PyInstaller did not create the expected executable."
          }

  release-artifact:
    name: Build unsigned release installer
    if: startsWith(github.ref, 'refs/tags/v')
    needs: checks
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r app\requirements.txt

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build unsigned installer from repository source
        shell: pwsh
        working-directory: app
        run: .\build_release.ps1 -Mode Unsigned

      - name: Upload unsigned installer for signing or publication
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          name: Knizhnitsa-Setup-${{ github.ref_name }}-unsigned
          path: app\dist\installer\Knizhnitsa-Setup.exe
          if-no-files-found: error
