<!DOCTYPE html>
<html lang="ru" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Книжница</title>
<style>
  /* ===================== БАЗА (нейтральная, без коричневого) ===================== */
  :root, [data-theme="light"]{
    --bg:#f6f6f4; --panel:#ffffff; --panel2:#efefec; --ink:#1c1c1e; --muted:#83838b;
    --line:#e7e7e2; --paper:#ffffff;
    --accent:#3f4ea3; --accent-soft:rgba(63,78,163,.12); --on-accent:#fff;
    --ok:#3c9b6a; --danger:#d1493f;
    --shadow:0 1px 2px rgba(20,20,30,.05),0 8px 28px rgba(20,20,30,.07);
  }
  [data-theme="dark"]{
    --bg:#161618; --panel:#202023; --panel2:#2a2a2e; --ink:#f1f1f3; --muted:#9a9aa3;
    --line:#2e2e33; --paper:#1b1b1e;
    --accent:#7c8af0; --accent-soft:rgba(124,138,240,.20); --on-accent:#fff;
    --ok:#5fbd86; --danger:#e0685c;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 12px 40px rgba(0,0,0,.5);
  }
  *{box-sizing:border-box}
  html,body{height:100%}
  body{margin:0;font-family:"Segoe UI",Roboto,system-ui,sans-serif;background:var(--bg);color:var(--ink);
    -webkit-font-smoothing:antialiased;overflow:hidden;transition:background .2s,color .2s}
  button{font-family:inherit;cursor:pointer}
  .ic{display:block;flex-shrink:0}
  .hidden{display:none!important}
  ::-webkit-scrollbar{width:11px;height:11px}
  ::-webkit-scrollbar-thumb{background:var(--line);border-radius:6px;border:3px solid var(--bg)}
  ::-webkit-scrollbar-thumb:hover{background:var(--muted)}

  /* ===================== КНОПКИ ===================== */
  .btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--panel);
    color:var(--ink);padding:9px 15px;border-radius:11px;font-size:14px;transition:.14s;white-space:nowrap}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.primary{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
  .btn.primary:hover{filter:brightness(1.08);color:var(--on-accent)}
  .btn.danger{background:var(--danger);color:#fff;border-color:var(--danger)}
  .btn.danger:hover{filter:brightness(1.06);color:#fff}
  .btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}
  .btn.ghost:hover{color:var(--accent);background:var(--accent-soft)}
  .btn.small{padding:6px 11px;font-size:13px;border-radius:9px}
  .btn.icon{padding:8px;border-radius:10px}

  /* ===================== ВЕРХНЯЯ ПАНЕЛЬ ===================== */
  .topbar{height:52px;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);
    border-bottom:1px solid var(--line);position:relative;z-index:20}
  .topbar .spacer{flex:1}
  .tb-side{display:flex;align-items:center;gap:10px;min-width:0}
  .tb-title{font-weight:600;font-size:15px;max-width:340px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
  .tb-title:hover{color:var(--accent)}
  .stat{font-size:13px;color:var(--muted);white-space:nowrap}
  .stat b{color:var(--ink);font-weight:600}

  /* ===================== ДОМ (по центру) ===================== */
  #home{height:calc(100vh - 52px);overflow-y:auto;display:flex;flex-direction:column;align-items:center}
  #homeInner{width:100%;max-width:880px;padding:80px 28px 60px;text-align:center}
  #home h1{font-size:36px;margin:0 0 8px;font-weight:700;letter-spacing:-.5px}
  #home .sub{color:var(--muted);margin:0 0 44px;font-size:16px}
  .books-grid{display:flex;flex-wrap:wrap;justify-content:center;gap:20px}
  .book-card{width:248px;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:18px;
    padding:22px;min-height:166px;display:flex;flex-direction:column;box-shadow:var(--shadow);transition:.16s;
    position:relative;cursor:pointer}
  .book-card:hover{transform:translateY(-3px)}
  .book-card.add{align-items:center;justify-content:center;color:var(--accent);border:1.5px dashed var(--line);
    background:transparent;box-shadow:none;gap:10px}
  .book-card.add:hover{border-color:var(--accent);background:var(--accent-soft)}
  .book-card .bt{font-size:19px;font-weight:650;margin-bottom:8px;letter-spacing:-.2px}
  .book-card .bm{color:var(--muted);font-size:13px}
  .book-card .bspacer{flex:1}
  .book-card .foot{display:flex;align-items:center;justify-content:space-between;margin-top:16px}
  .book-card .del{position:absolute;top:12px;right:12px;opacity:0;transition:.15s}
  .book-card:hover .del{opacity:1}

  /* ===================== ЭКРАН КНИГИ ===================== */
  #book{display:flex;height:calc(100vh - 52px)}
  .sidebar{width:288px;flex-shrink:0;background:var(--panel);border-right:1px solid var(--line);overflow-y:auto;padding:14px 12px}
  .side-book{display:flex;align-items:center;gap:10px;padding:10px 11px;border-radius:11px;cursor:pointer;margin-bottom:16px;transition:.12s}
  .side-book:hover{background:var(--accent-soft)}
  .side-book.active{background:var(--accent-soft)}
  .side-book .bk-mark{width:30px;height:30px;border-radius:8px;background:var(--accent);color:var(--on-accent);
    display:flex;align-items:center;justify-content:center;flex-shrink:0}
  .side-book .bk-name{font-weight:600;font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .side-book .bk-sub{font-size:11px;color:var(--muted)}
  .side-group{margin-bottom:22px}
  .side-head{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 8px;color:var(--muted);
    font-size:11px;text-transform:uppercase;letter-spacing:.8px;font-weight:600}
  .side-head .add{color:var(--accent);padding:3px;border-radius:7px;display:flex;cursor:pointer}
  .side-head .add:hover{background:var(--accent-soft)}
  .nav-item{display:flex;align-items:center;gap:9px;padding:9px 11px;border-radius:10px;font-size:14px;cursor:pointer;
    color:var(--ink);transition:.12s;position:relative;min-height:44px}
  .nav-item:hover{background:var(--accent-soft)}
  .chapter-item{cursor:grab}
  .chapter-item:active{cursor:grabbing}
  .nav-item.active{background:var(--accent-soft);color:var(--accent);font-weight:600}
  .nav-item .num{color:var(--muted);font-size:12px;min-width:16px;text-align:right}
  .nav-item.active .num{color:var(--accent)}
  .nav-item .avatar{width:26px;height:26px;border-radius:7px;object-fit:cover;background:var(--panel2);flex-shrink:0;
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .nav-item .label{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .nav-actions{width:50px;display:flex;justify-content:flex-end;gap:2px;opacity:.38;flex-shrink:0;transition:.12s}
  .nav-item:hover .nav-actions,.nav-item.active .nav-actions{opacity:1}
  .nav-actions button{width:23px;height:23px;border:none;background:transparent;color:var(--muted);padding:0;border-radius:7px;
    display:flex;align-items:center;justify-content:center;cursor:pointer}
  .nav-actions button:hover{color:var(--accent);background:var(--panel)}
  .chapter-list{position:relative}
  .chapter-list.sorting .chapter-item{transition:transform .16s ease,background .12s,border-color .12s}
  .chapter-item{touch-action:none}
  .chapter-item.dragging{z-index:5;background:var(--panel);box-shadow:var(--shadow);transition:none}
  .side-empty{color:var(--muted);font-size:13px;padding:8px 11px;font-style:italic;opacity:.8}

  .main{flex:1;overflow-y:auto;display:flex;flex-direction:column}
  .wrap{max-width:780px;width:100%;margin:0 auto;padding:36px 32px 140px;flex:1}
  .ed-title{width:100%;border:none;background:transparent;font-size:28px;font-weight:700;color:var(--ink);
    outline:none;margin-bottom:8px;font-family:inherit;letter-spacing:-.4px}
  .ed-meta{display:flex;gap:13px;align-items:center;color:var(--muted);font-size:13px;margin-bottom:22px;
    border-bottom:1px solid var(--line);padding-bottom:16px;flex-wrap:wrap}
  .ed-meta .saved{color:var(--ok);display:inline-flex;align-items:center;gap:5px}
  .ed-body{width:100%;min-height:58vh;border:none;background:transparent;outline:none;resize:none;
    font-family:"Georgia","Times New Roman",serif;font-size:var(--ed-size,19px);line-height:1.85;color:var(--ink)}
  .placeholder{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100%;
    color:var(--muted);text-align:center;gap:14px;padding:40px}
  .placeholder .pic{color:var(--line)}

  /* ===================== ПОЛЯ ===================== */
  .fld label{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);display:block;margin-bottom:6px;font-weight:600}
  .fld input,.fld textarea,.fld select{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;
    padding:11px 13px;font-family:inherit;font-size:15px;color:var(--ink);outline:none;transition:.14s}
  .fld input:focus,.fld textarea:focus,.fld select:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .fld textarea{resize:none;overflow:hidden;line-height:1.6;min-height:46px}
  .fld select{appearance:none;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='14' height='14' viewBox='0 0 24 24' fill='none' stroke='%2383838b' stroke-width='2' stroke-linecap='round' stroke-linejoin='round'><polyline points='6 9 12 15 18 9'/></svg>");background-repeat:no-repeat;background-position:right 13px center;padding-right:38px}
  .fld-grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
  .fld-stack{display:flex;flex-direction:column;gap:18px}
  .hint{font-size:12px;color:var(--muted);margin-top:6px}
  .ovstats{display:flex;gap:30px;flex-wrap:wrap;margin:14px 0 30px;padding-bottom:24px;border-bottom:1px solid var(--line)}
  .ovstat .n{font-size:25px;font-weight:700;letter-spacing:-.5px}
  .ovstat .l{font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.5px;margin-top:3px}

  /* ===================== ПЕРСОНАЖ: ПРОФИЛЬ ===================== */
  .pagehead{display:flex;align-items:center;justify-content:space-between;margin-bottom:26px}
  .profile-top{display:flex;gap:24px;align-items:flex-start;margin-bottom:8px}
  .portrait{width:160px;flex-shrink:0;border-radius:18px;overflow:hidden;background:var(--panel2);border:1px solid var(--line);
    display:flex;align-items:center;justify-content:center;color:var(--muted)}
  .portrait img{width:100%;height:auto;display:block}
  .portrait.empty{aspect-ratio:4/5}
  .character-wrap{max-width:1180px}
  .character-layout{display:grid;grid-template-columns:minmax(300px,420px) minmax(0,1fr);gap:28px;align-items:start}
  .character-photo-panel{width:100%;position:sticky;top:28px}
  .character-main{min-width:0;max-width:690px}
  .portrait.large{width:100%;aspect-ratio:4/5;min-height:360px;background:#101014;border-color:#25252b}
  .portrait.large img{width:100%;height:100%;object-fit:contain}
  .portrait-button{padding:0;cursor:zoom-in;text-align:inherit}
  .portrait-button:hover{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .photo-actions{display:flex;flex-direction:column;gap:8px;margin-top:10px}
  .profile-id{flex:1;min-width:0;padding-top:6px}
  .profile-id .pname{font-size:30px;font-weight:700;letter-spacing:-.4px;margin:0 0 10px}
  .badge{display:inline-flex;align-items:center;gap:6px;background:var(--accent-soft);color:var(--accent);
    padding:5px 12px;border-radius:999px;font-size:13px;font-weight:600}
  .profile-meta{color:var(--muted);font-size:14px;margin-top:12px;line-height:1.7}
  .profile-meta b{color:var(--ink);font-weight:600}
  .alias-line{margin-top:12px;color:var(--muted);font-size:13px;line-height:1.55}
  .character-tabs{display:flex;gap:6px;flex-wrap:wrap;border-bottom:1px solid var(--line);margin:18px 0 4px}
  .character-tabs button{border:none;background:transparent;color:var(--muted);padding:10px 12px;border-radius:9px 9px 0 0;
    display:flex;align-items:center;gap:7px;font-size:13px;font-weight:650;cursor:pointer}
  .character-tabs button:hover{background:var(--accent-soft);color:var(--accent)}
  .character-tabs button.on{background:var(--accent-soft);color:var(--accent)}
  .section{margin-top:26px}
  .section h4{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);margin:0 0 8px;font-weight:700}
  .section p{margin:0;font-size:15.5px;line-height:1.7;white-space:pre-wrap}
  .empty-note{color:var(--muted);font-style:italic;opacity:.8}
  .relationship-list{display:flex;flex-direction:column;gap:10px}
  .relationship-card{display:grid;grid-template-columns:58px minmax(0,1fr) auto;gap:10px;align-items:center;border:1px solid var(--line);
    background:var(--panel);border-radius:12px;padding:12px 14px}
  .relationship-card .thread-sample{width:58px}
  .relationship-name{font-size:15px;font-weight:750;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .relationship-meta{font-size:12px;color:var(--muted);margin-top:4px}
  .relationship-note{grid-column:1 / -1;color:var(--muted);font-size:13px;line-height:1.55;white-space:pre-wrap}
  .relationship-actions{display:flex;gap:4px}
  .quick-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .quick-tile{border:1px solid var(--line);background:var(--panel);border-radius:12px;padding:14px;display:flex;gap:11px;
    align-items:flex-start;text-align:left;color:var(--ink);cursor:pointer}
  .quick-tile:hover{border-color:var(--accent);background:var(--accent-soft)}
  .quick-tile .qt-ico{color:var(--accent);padding-top:1px}
  .quick-tile .qt-text{min-width:0;display:flex;flex-direction:column;gap:4px}
  .quick-tile .qt-title{display:block;font-weight:750;font-size:14px;line-height:1.25}
  .quick-tile .qt-sub{display:block;color:var(--muted);font-size:12px;line-height:1.45}
  .appearance-list{display:flex;flex-direction:column;gap:10px}
  .appearance-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:12px;align-items:center;border:1px solid var(--line);
    background:var(--panel);border-radius:12px;padding:12px 14px}
  .appearance-title{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .appearance-meta{font-size:12px;color:var(--muted);margin-top:3px}
  .appearance-snippet{grid-column:1 / -1;font-size:13px;line-height:1.55;color:var(--muted);white-space:normal}
  .appearance-snippet mark{background:var(--accent-soft);color:var(--accent);border-radius:4px;padding:0 3px}

  /* ===================== ПРЕДПРОСМОТР ===================== */
  #preview{position:fixed;inset:0;background:#d7d7d3;z-index:40;overflow-y:auto;padding:54px 20px 40px}
  [data-theme="dark"] #preview{background:#0e0e10}
  .pv-toolbar{position:fixed;top:16px;right:20px;display:flex;gap:8px;z-index:41}
  .pv-page{max-width:580px;margin:0 auto 30px;background:#fdfdfb;color:#1d1d1f;box-shadow:0 10px 40px rgba(0,0,0,.22);
    padding:70px 64px;border-radius:4px;min-height:780px;font-family:"Georgia",serif;line-height:1.75}
  .pv-page h2{text-align:center;font-size:23px;margin:0 0 8px;font-weight:600}
  .pv-page .pv-cnum{text-align:center;color:#aaa;font-size:12px;margin-bottom:38px;letter-spacing:3px}
  .pv-page p{text-indent:1.7em;margin:0 0 3px;text-align:justify;font-size:17px;white-space:pre-wrap}
  .pv-title-page{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .pv-title-page .tt{font-size:34px;font-weight:700;margin-bottom:16px}
  .pv-title-page .ta{color:#aaa}

  /* ===================== МОДАЛКИ ===================== */
  .modal-back{position:fixed;inset:0;background:rgba(10,10,15,.5);z-index:50;display:flex;align-items:center;
    justify-content:center;padding:24px;backdrop-filter:blur(3px)}
  .modal{background:var(--panel);border-radius:20px;box-shadow:var(--shadow);width:100%;max-width:520px;max-height:88vh;
    display:flex;flex-direction:column;overflow:hidden;border:1px solid var(--line)}
  .modal.wide{max-width:680px}
  .modal h3{margin:0;padding:24px 26px 4px;font-size:19px;font-weight:680;letter-spacing:-.3px}
  .mpad{padding:16px 26px 6px}
  .mmsg{color:var(--muted);font-size:14px;line-height:1.55;padding-bottom:8px}
  .flbl{font-size:11px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);display:block;margin-bottom:8px;font-weight:600}
  .finput{width:100%;border:1px solid var(--line);background:var(--paper);border-radius:12px;padding:12px 14px;
    font-family:inherit;font-size:15px;color:var(--ink);outline:none}
  .finput:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .modal .mbody{overflow-y:auto;padding:6px 0}
  .modal .mfoot{padding:18px 26px;display:flex;justify-content:flex-end;gap:10px}
  .modal.photo{max-width:min(1120px,calc(100vw - 48px));height:min(88vh,880px);background:#0f0f12;color:#fff}
  .photo-view-head{display:flex;align-items:center;justify-content:space-between;gap:14px;padding:14px 16px;border-bottom:1px solid rgba(255,255,255,.12)}
  .modal.photo h3{padding:0;margin:0;color:#fff;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .photo-view-body{flex:1;min-height:0;display:flex;align-items:center;justify-content:center;padding:18px}
  .photo-view-body img{max-width:100%;max-height:100%;object-fit:contain;border-radius:12px}
  .set-section{padding:18px 26px;border-top:1px solid var(--line)}
  .set-section:first-child{border-top:none}
  .set-section .sh{font-size:12px;text-transform:uppercase;letter-spacing:.7px;color:var(--muted);font-weight:700;margin-bottom:14px}
  .seg{display:inline-flex;background:var(--panel2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px}
  .seg button{border:none;background:transparent;color:var(--muted);padding:8px 16px;border-radius:8px;display:flex;align-items:center;gap:7px;font-size:14px}
  .seg button.on{background:var(--panel);color:var(--ink);box-shadow:var(--shadow)}
  .swatches{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
  .swatch{height:46px;border-radius:12px;border:2px solid transparent;cursor:pointer;position:relative;transition:.12s;display:flex;align-items:flex-end;justify-content:center;padding-bottom:5px}
  .swatch:hover{transform:scale(1.05)}
  .swatch.on{border-color:var(--ink)}
  .swatch .nm{font-size:10px;color:#fff;opacity:0;font-weight:600;text-shadow:0 1px 2px rgba(0,0,0,.4)}
  .swatch.on .nm,.swatch:hover .nm{opacity:1}
  .ver-row{display:flex;align-items:center;gap:12px;padding:13px 26px;border-bottom:1px solid var(--line)}
  .ver-row:hover{background:var(--accent-soft)}
  .ver-row .vinfo{flex:1;min-width:0}
  .ver-row .vt{font-size:14px}
  .ver-row .vp{color:var(--muted);font-size:12px;margin-top:3px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

  .search-box{display:flex;align-items:center;gap:10px;border:1px solid var(--line);background:var(--paper);
    border-radius:14px;padding:12px 14px}
  .search-box:focus-within{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .search-box .ic{color:var(--muted)}
  .search-input{border:none;background:transparent;outline:none;color:var(--ink);font:inherit;font-size:17px;width:100%}
  .search-results{padding:4px 14px 16px;display:flex;flex-direction:column;gap:8px;min-height:190px}
  .search-empty{padding:34px 12px;color:var(--muted);text-align:center;line-height:1.5}
  .search-result{border:1px solid var(--line);background:var(--paper);border-radius:14px;padding:13px 14px;
    cursor:pointer;transition:.14s}
  .search-result:hover{border-color:var(--accent);background:var(--accent-soft)}
  .sr-top{display:flex;gap:10px;align-items:center;min-width:0}
  .sr-kind{font-size:11px;text-transform:uppercase;letter-spacing:.6px;color:var(--accent);font-weight:700;white-space:nowrap}
  .sr-title{font-size:15px;font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sr-book{font-size:12px;color:var(--muted);margin-top:4px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sr-snippet{font-size:13px;color:var(--muted);line-height:1.45;margin-top:8px}
  .sr-snippet mark{background:var(--accent-soft);color:var(--ink);border-radius:4px;padding:0 2px}

  .plan-list{display:flex;flex-direction:column;gap:14px;margin-top:22px}
  .plan-card{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:16px;
    box-shadow:0 1px 2px rgba(20,20,30,.04)}
  .plan-card-head{display:flex;align-items:center;gap:12px;margin-bottom:12px}
  .plan-num{width:34px;height:34px;border-radius:10px;background:var(--accent-soft);color:var(--accent);

  .trash-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:11px}
  .map-wrap{max-width:none;padding:22px 28px 46px}
  .map-pagehead{margin-bottom:14px}

    background-size:26px 26px,100% 100%;overflow:hidden;margin-top:0;cursor:grab;touch-action:none}

  .chapter-characters{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
  .char-chip{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);background:var(--panel);

      linear-gradient(180deg,#1b1b1f,#18181b)}

function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function now(){ return Date.now(); }
function countWords(t){ t=(t||"").trim(); return t?t.split(/\s+/).length:0; }
function countChars(t){ return (t||"").length; }
function fmt(n){ return n.toLocaleString(dateLocale()); }
function uniqueClean(list){
  const seen=new Set(),out=[];
  (list||[]).forEach(v=>{
    const s=String(v||"").replace(/\s+/g," ").trim();
    const key=s.toLocaleLowerCase("ru-RU");
    if(s&&s.length>=2&&!seen.has(key)){ seen.add(key); out.push(s); }
  });
  return out;
}
function parseAliases(text){ return uniqueClean(String(text||"").split(/[\n,;]+/)); }
function characterTerms(c){
  normalizeCharacter(c);
  return uniqueClean([c.name,...(c.aliases||[])]).sort((a,b)=>b.length-a.length);
}
function characterMatcher(c){
  const terms=characterTerms(c);
  if(!terms.length) return null;
  return new RegExp(`(^|[^\\p{L}\\p{N}_])(${terms.map(escapeRegExp).join("|")})(?=$|[^\\p{L}\\p{N}_])`,"giu");
}
function characterMentionsInText(c,text){
  const rx=characterMatcher(c),src=text||"",res=[];
  if(!rx) return res;
  let m;
  while((m=rx.exec(src))!==null){
    const start=m.index+(m[1]||"").length,term=m[2]||"";
    res.push({index:start,term});
  }
  return res;
}
function characterChapterAppearances(b,c){
  return (b.chapters||[]).map((ch,i)=>{
    const mentions=characterMentionsInText(c,ch.content||"");
    return {chapter:ch,index:i,count:mentions.length,first:mentions[0]||null};
  }).filter(x=>x.count>0);
}
function chapterCharacterMentions(b,ch){
  return (b.characters||[]).map(c=>({character:c,count:characterMentionsInText(c,ch.content||"").length}))
    .filter(x=>x.count>0);
}
function mentionSnippet(text,mention){
  const src=text||"",start=Math.max(0,mention.index-70),end=Math.min(src.length,mention.index+mention.term.length+90);
  const before=(start>0?"…":"")+src.slice(start,mention.index);
  const hit=src.slice(mention.index,mention.index+mention.term.length);
  const after=src.slice(mention.index+mention.term.length,end)+(end<src.length?"…":"");
  return `${escapeHtml(before)}<mark>${escapeHtml(hit)}</mark>${escapeHtml(after)}`;
}
function bookWordCount(b){ return b.chapters.reduce((s,c)=>s+countWords(c.content),0); }
function bookCharCount(b){ return b.chapters.reduce((s,c)=>s+countChars(c.content),0); }

function getBook(id){ return state.books.find(b=>b.id===id); }

function ensureData(){
  state.books=Array.isArray(state.books)?state.books:[];
  state.trash=state.trash||{};
  state.trash.books=Array.isArray(state.trash.books)?state.trash.books:[];
  state.trash.chapters=Array.isArray(state.trash.chapters)?state.trash.chapters:[];
  state.trash.characters=Array.isArray(state.trash.characters)?state.trash.characters:[];
  state.trash.lore=Array.isArray(state.trash.lore)?state.trash.lore:[];
  state.books.forEach(b=>{
    b.chapters=Array.isArray(b.chapters)?b.chapters:[];
    b.characters=Array.isArray(b.characters)?b.characters:[];
    b.characterLinks=Array.isArray(b.characterLinks)?b.characterLinks:[];
    b.lore=Array.isArray(b.lore)?b.lore:[];
    b.chapters.forEach(normalizeChapter);
    b.characters.forEach(normalizeCharacter);
    b.characterLinks.forEach(normalizeCharacterLink);

function normalizeChapter(ch){
  if(!ch.planStatus) ch.planStatus="Задумка";
  if(ch.planSummary===undefined) ch.planSummary="";
  if(ch.planNotes===undefined) ch.planNotes="";
  if(!Array.isArray(ch.versions)) ch.versions=[];
  return ch;
}
function cloneData(v){ return JSON.parse(JSON.stringify(v)); }
function normalizeCharacter(c){
  if(c.aliases===undefined) c.aliases=[];
  if(typeof c.aliases==="string") c.aliases=parseAliases(c.aliases);
  if(!Array.isArray(c.aliases)) c.aliases=[];
  c.aliases=uniqueClean(c.aliases);
  return c;
}
function normalizeLore(item){
  if(!item.type) item.type="Заметка";
  if(item.title===undefined) item.title="";
  if(item.summary===undefined) item.summary="";
  if(item.details===undefined) item.details="";
  if(item.links===undefined) item.links="";
  return item;
}
function normalizeCharacterLink(link){
  if(!link.id) link.id=uid();
  if(!link.from) link.from="";
  if(!link.to) link.to="";
  if(!link.type) link.type="Связь";
  if(link.note===undefined) link.note="";
  if(!RELATION_STRENGTHS[link.strength]) link.strength="normal";
  const st=RELATION_STYLES[link.type]||RELATION_STYLES["Другое"];
  if(!link.color) link.color=st.color;
  if(!link.pattern) link.pattern=st.pattern;
  return link;
}
function trashCount(){ ensureData(); return state.trash.books.length+state.trash.chapters.length+state.trash.characters.length+state.trash.lore.length; }

function withAlpha(hex,a){ const n=hex.replace("#",""); const r=parseInt(n.slice(0,2),16),g=parseInt(n.slice(2,4),16),b=parseInt(n.slice(4,6),16); return `rgba(${r},${g},${b},${a})`; }

function moveChapter(id,dir,ev){
  ev.stopPropagation();
  const b=curBook(),i=b.chapters.findIndex(c=>c.id===id),j=i+dir;
  if(j<0||j>=b.chapters.length) return;
  [b.chapters[i],b.chapters[j]]=[b.chapters[j],b.chapters[i]]; save(); renderSidebar(); if(route.view==="plan") renderMain();
}
let chapterDrag=null, suppressChapterClick=false;
function openChapterFromSidebar(ev,id){
  if(suppressChapterClick){ ev.preventDefault(); ev.stopPropagation(); return; }
  selectItem("chapter",id);
}
function startChapterDrag(ev,id){
  if(ev.button!==0||ev.target.closest("button")) return;
  const list=document.getElementById("chapterList"),el=ev.currentTarget,b=curBook();
  const index=b.chapters.findIndex(c=>c.id===id);
  if(!list||index<0) return;
  const items=[...list.querySelectorAll(".chapter-item")];
  const listRect=list.getBoundingClientRect(),rect=el.getBoundingClientRect();
  chapterDrag={id,index,targetIndex:index,startY:ev.clientY,lastY:ev.clientY,list,el,items,
    itemH:rect.height,topLimit:listRect.top-rect.top,bottomLimit:listRect.bottom-rect.bottom,moved:false};
  el.setPointerCapture(ev.pointerId);
  el.addEventListener("pointermove",moveChapterDrag);
  el.addEventListener("pointerup",finishChapterDrag,{once:true});
  el.addEventListener("pointercancel",cancelChapterDrag,{once:true});
}
function moveChapterDrag(ev){
  if(!chapterDrag) return;
  const d=chapterDrag,raw=ev.clientY-d.startY;
  const dy=Math.max(d.topLimit,Math.min(d.bottomLimit,raw));
  if(Math.abs(dy)>3) d.moved=true;
  d.lastY=ev.clientY;
  d.list.classList.add("sorting");
  d.el.classList.add("dragging");
  d.el.style.transform=`translateY(${dy}px)`;
  const next=Math.max(0,Math.min(d.items.length-1,Math.round((d.index*d.itemH+dy)/d.itemH)));
  d.targetIndex=next;
  d.items.forEach((item,i)=>{
    if(item===d.el) return;
    let shift=0;
    if(next>d.index&&i>d.index&&i<=next) shift=-d.itemH;
    if(next<d.index&&i>=next&&i<d.index) shift=d.itemH;
    item.style.transform=shift?`translateY(${shift}px)`:"";
  });
}
function finishChapterDrag(ev){
  if(!chapterDrag) return;
  const d=chapterDrag;
  d.el.removeEventListener("pointermove",moveChapterDrag);
  cleanupChapterDragStyles();
  if(!d.moved){ chapterDrag=null; return; }
  suppressChapterClick=true; setTimeout(()=>suppressChapterClick=false,0);
  if(d.targetIndex!==d.index){
    const b=curBook();
    const [moved]=b.chapters.splice(d.index,1);
    b.chapters.splice(d.targetIndex,0,moved);
    b.updatedAt=now(); save();
  }
  chapterDrag=null;
  renderSidebar(); if(route.view==="plan") renderMain();
}
function cancelChapterDrag(ev){
  if(chapterDrag){ chapterDrag.el.removeEventListener("pointermove",moveChapterDrag); }
  cleanupChapterDragStyles(); chapterDrag=null;
}
function cleanupChapterDragStyles(){
  if(!chapterDrag) return;
  chapterDrag.list.classList.remove("sorting");
  chapterDrag.items.forEach(item=>{ item.classList.remove("dragging"); item.style.transform=""; });
}

function renderCharacterMap(main,b){

    main.innerHTML=`<div class="wrap map-wrap">
      <div class="pagehead"><h1>${t("characterMap")}</h1></div>
      <div class="placeholder"><div class="pic">${icon('map',56)}</div>
        <div>${t("mapEmpty")}</div>
        <button class="btn primary" onclick="addCharacter()">${icon('plus',16)} ${t("addCharacter")}</button>
      </div>
    </div>`;
    return;
  }
  const pos=characterMapPositions(b),links=validCharacterLinks(b);
  const zoomPct=Math.round(b.characterMapZoom*100);
  const worldScale=mapWorldScale(b.characterMapZoom);
  const panX=Number(b.characterMapPanX)||0,panY=Number(b.characterMapPanY)||0;
  const nodes=b.characters.map(c=>{
    const p=pos[c.id],avatar=c.photo?`<img src="${c.photo}">`:icon('user',20);
    return `<div class="map-node" data-character-id="${c.id}" style="left:${p.x}%;top:${p.y}%"

        <span class="map-role">${escapeHtml(roleOrFallback(c.role))}</span></span>
    </div>`;
  }).join("");
  const lines=links.map(link=>mapLinkSvg(b,link,pos)).join("");
  const linkRows=links.length?links.map(link=>renderCharacterLinkCard(b,link)).join(""):`<div class="section" style="margin:0">
    <p class="empty-note">${t("noLinks")}</p>
  </div>`;
  main.innerHTML=`<div class="wrap map-wrap">
    <div class="pagehead map-pagehead">
      <h1>${t("characterMap")}</h1>
      <div class="map-tools">
        <button class="btn small icon" title="${t("zoomOut")}" onclick="setCharacterMapZoom(-1)">${icon('minus',16)}</button>
        <span class="zoom-pill">${zoomPct}%</span>
        <button class="btn small icon" title="${t("zoomIn")}" onclick="setCharacterMapZoom(1)">${icon('plus',16)}</button>
        <button class="btn small ghost" onclick="resetCharacterMapZoom()">100%</button>
        ${b.characters.length>1?`<button class="btn primary" onclick="openAddCharacterLink()">${icon('plus',16)} ${t("newLink")}</button>`:""}
      </div>
    </div>
    <div class="map-studio">
      <div class="map-board" id="characterMapBoard" onwheel="onCharacterMapWheel(event)" onpointerdown="startMapPan(event)">
        <div class="map-canvas" id="characterMapCanvas" style="--map-zoom:${b.characterMapZoom};--map-world-scale:${worldScale};--map-pan-x:${panX}px;--map-pan-y:${panY}px">
          <svg class="map-svg" id="characterMapSvg" viewBox="0 0 100 100" preserveAspectRatio="none">${lines}</svg>
          ${nodes}
        </div>
      </div>
      <div class="map-panel">
        <div class="map-panel-section">
          <div class="map-panel-title">${t("legend")}</div>
          <div class="legend-grid">${renderMapLegend(b)}</div>
        </div>
        <div class="map-panel-section" style="padding-bottom:0;border-bottom:none">
          <div class="map-panel-title">${t("links")}</div>
        </div>
        <div class="link-list">${linkRows}</div>
      </div>
    </div>
  </div>`;
}
function clampMapZoom(v){ v=Number(v)||1; return Math.max(MAP_MIN_ZOOM,Math.min(MAP_MAX_ZOOM,v)); }
function mapWorldScale(zoom){ return Math.min(1,clampMapZoom(zoom)); }
function setCharacterMapZoom(dir){
  const b=curBook(); if(!b) return;
  b.characterMapZoom=clampMapZoom((b.characterMapZoom||1)+(dir*MAP_ZOOM_STEP));
  if(b.characterMapZoom<=1){ b.characterMapPanX=0; b.characterMapPanY=0; }
  b.updatedAt=now(); save(); renderMain();
}
function resetCharacterMapZoom(){
  const b=curBook(); if(!b) return;
  b.characterMapZoom=1; b.characterMapPanX=0; b.characterMapPanY=0; b.updatedAt=now(); save(); renderMain();
}
function onCharacterMapWheel(ev){
  ev.preventDefault();
  setCharacterMapZoom(ev.deltaY<0?1:-1);
}
function characterMapPositions(b){
  const res={},chars=b.characters||[],count=Math.max(chars.length,1);
  chars.forEach((c,i)=>{
    const savedX=Number(c.mapX),savedY=Number(c.mapY);
    if(Number.isFinite(savedX)&&Number.isFinite(savedY)){
      res[c.id]={x:clampMap(savedX,0,100),y:clampMap(savedY,0,100)};
    }else if(count===1){
      res[c.id]={x:50,y:48};
    }else{
      const angle=-Math.PI/2+(Math.PI*2*i/count);
      res[c.id]={x:50+38*Math.cos(angle),y:50+34*Math.sin(angle)};
    }
  });
  return res;
}
function clampMap(v,min,max){ return Math.max(min,Math.min(max,v)); }
function validCharacterLinks(b){
  const ids=new Set((b.characters||[]).map(c=>c.id));
  return (b.characterLinks||[]).map(normalizeCharacterLink).filter(l=>ids.has(l.from)&&ids.has(l.to)&&l.from!==l.to);
}
function mapLinkSvg(book,link,pos){
  const a=pos[link.from],b=pos[link.to]; if(!a||!b) return "";
  const st=relationStyle(link),path=mapCurvePath(a,b);
  const tip=link.note&&link.note.trim()?link.note.trim():`${characterName(book,link.from)} — ${characterName(book,link.to)}: ${labelEnum("relations",link.type||"Связь")}`;
  return `<g data-link-id="${link.id}">
    <path id="mapHit${link.id}" class="map-link-hit" d="${path}"><title>${escapeHtml(tip)}</title></path>
    <path id="mapShadow${link.id}" class="map-line-shadow" d="${path}"></path>
    <path id="mapLine${link.id}" class="map-line" d="${path}"
      style="stroke:${st.color};stroke-width:${st.width};${st.dash?`stroke-dasharray:${st.dash};`:''}"></path>
  </g>`;
}
function mapCurvePath(a,b){
  const dx=b.x-a.x,dy=b.y-a.y,dist=Math.max(1,Math.hypot(dx,dy));
  const bend=Math.min(8,dist*.12);
  const nx=-dy/dist,ny=dx/dist;
  const mx=(a.x+b.x)/2+nx*bend,my=(a.y+b.y)/2+ny*bend;
  return `M ${a.x} ${a.y} Q ${mx} ${my} ${b.x} ${b.y}`;
}
function renderCharacterLinkCard(b,link){
  const from=characterName(b,link.from),to=characterName(b,link.to);
  const st=relationStyle(link);
  const note=link.note&&link.note.trim()?link.note.trim():t("noNote");
  return `<div class="link-card" style="--thread-color:${st.color}" title="${escapeAttr(note)}">
    <span class="thread-sample"><svg viewBox="0 0 58 14"><line x1="3" y1="7" x2="55" y2="7"
      stroke="${st.color}" stroke-width="${st.width}" stroke-linecap="round" ${st.dash?`stroke-dasharray="${st.dash}"`:''}></line></svg></span>
    <span class="rel-badge">${escapeHtml(labelEnum("relations",link.type||"Связь"))}</span>
    <div class="link-main">
      <div class="link-title">${escapeHtml(from)} — ${escapeHtml(to)}</div>
      <div class="link-note">${escapeHtml(note)}</div>
    </div>
    <button class="btn small ghost" title="${t("setupLink")}" onclick="openAddCharacterLink('${link.id}')">${icon('edit',15)}</button>
    <button class="btn small ghost" title="${t("deleteLink")}" onclick="deleteCharacterLink('${link.id}')">${icon('trash',15)}</button>
  </div>`;
}
function characterName(b,id){
  const c=(b.characters||[]).find(x=>x.id===id);
  return c?nameOrFallback(c.name):characterFallback();
}
function relationStyle(linkOrType){
  const link=typeof linkOrType==="string"?{type:linkOrType}:linkOrType;
  const base=RELATION_STYLES[link.type]||RELATION_STYLES["Другое"];
  const pattern=THREAD_PATTERNS[base.pattern]||THREAD_PATTERNS.solid;
  const strength=RELATION_STRENGTHS[link.strength]||RELATION_STRENGTHS.normal;
  return {color:base.color,dash:pattern.dash,width:strength.width,pattern:base.pattern,strength:link.strength||"normal"};
}
function threadSample(st){
  return `<span class="thread-sample"><svg viewBox="0 0 58 14"><line x1="3" y1="7" x2="55" y2="7"
    stroke="${st.color}" stroke-width="${st.width}" stroke-linecap="round" ${st.dash?`stroke-dasharray="${st.dash}"`:''}></line></svg></span>`;
}
function renderMapLegend(b){
  const seen=new Map();
  validCharacterLinks(b).forEach(link=>{
    const key=(link.type||"Связь")+"|"+(link.color||"")+"|"+(link.pattern||"");
    if(!seen.has(key)) seen.set(key,link);
  });
  const rows=[...seen.values()];
  if(!rows.length) rows.push(...["Союз","Конфликт","Тайна"].map(t=>({type:t,...RELATION_STYLES[t]})));
  return rows.map(link=>{
    const st=relationStyle(link);
    return `<div class="legend-row" style="--thread-color:${st.color}">${threadSample(st)}<span class="legend-name">${escapeHtml(labelEnum("relations",link.type||"Связь"))}</span></div>`;
  }).join("");
}
function openMapCharacter(ev,id){
  if(suppressMapClick){ ev.preventDefault(); ev.stopPropagation(); return; }
  selectItem("character",id);
}
let mapDrag=null,mapPan=null,suppressMapClick=false;
function clampMapPan(value,visibleSize,zoom,worldScale){
  const contentSize=visibleSize*(zoom/worldScale);
  if(contentSize<=visibleSize) return 0;
  return clampMap(value,visibleSize-contentSize,0);
}
function applyMapPan(){
  if(!mapPan) return;
  const canvas=document.getElementById("characterMapCanvas");
  if(canvas){
    canvas.style.setProperty("--map-pan-x",mapPan.book.characterMapPanX+"px");
    canvas.style.setProperty("--map-pan-y",mapPan.book.characterMapPanY+"px");
  }
}
function startMapPan(ev){
  if((ev.button!==undefined&&ev.button!==0)||ev.target.closest(".map-node")||ev.target.closest("button")) return;
  const b=curBook(),board=document.getElementById("characterMapBoard");
  if(!b||!board||clampMapZoom(b.characterMapZoom||1)<=1) return;
  const rect=board.getBoundingClientRect(),zoom=clampMapZoom(b.characterMapZoom||1),worldScale=mapWorldScale(zoom);
  mapPan={book:b,board,rect,zoom,worldScale,startX:ev.clientX,startY:ev.clientY,
    startPanX:Number(b.characterMapPanX)||0,startPanY:Number(b.characterMapPanY)||0,moved:false};
  board.setPointerCapture(ev.pointerId);
  board.classList.add("panning");
  board.addEventListener("pointermove",moveMapPan);
  board.addEventListener("pointerup",finishMapPan,{once:true});
  board.addEventListener("pointercancel",cancelMapPan,{once:true});
}
function moveMapPan(ev){
  if(!mapPan) return;
  const d=mapPan,dx=ev.clientX-d.startX,dy=ev.clientY-d.startY;
  if(Math.hypot(dx,dy)>4) d.moved=true;
  d.book.characterMapPanX=Number(clampMapPan(d.startPanX+dx,d.rect.width,d.zoom,d.worldScale).toFixed(1));
  d.book.characterMapPanY=Number(clampMapPan(d.startPanY+dy,d.rect.height,d.zoom,d.worldScale).toFixed(1));
  applyMapPan();
}
function finishMapPan(ev){
  if(!mapPan) return;
  mapPan.board.removeEventListener("pointermove",moveMapPan);
  mapPan.board.classList.remove("panning");
  if(mapPan.moved){
    suppressMapClick=true; setTimeout(()=>suppressMapClick=false,0);
    mapPan.book.updatedAt=now(); save();
  }
  mapPan=null;
}
function cancelMapPan(ev){
  if(mapPan){
    mapPan.board.removeEventListener("pointermove",moveMapPan);
    mapPan.board.classList.remove("panning");
  }
  mapPan=null;
}
function startMapNodeDrag(ev,id){
  if((ev.button!==undefined&&ev.button!==0)||ev.target.closest("button")) return;
  const b=curBook(),c=b&&b.characters.find(x=>x.id===id),board=document.getElementById("characterMapBoard");
  if(!c||!board) return;
  const el=ev.currentTarget,rect=board.getBoundingClientRect();
  const zoom=clampMapZoom(b.characterMapZoom||1),worldScale=mapWorldScale(zoom);
  mapDrag={id,book:b,char:c,el,rect,zoom,worldScale,panX:Number(b.characterMapPanX)||0,panY:Number(b.characterMapPanY)||0,
    moved:false,startX:ev.clientX,startY:ev.clientY};
  el.setPointerCapture(ev.pointerId);
  el.classList.add("dragging");
  el.addEventListener("pointermove",moveMapNodeDrag);
  el.addEventListener("pointerup",finishMapNodeDrag,{once:true});
  el.addEventListener("pointercancel",cancelMapNodeDrag,{once:true});
}
function moveMapNodeDrag(ev){
  if(!mapDrag) return;
  const d=mapDrag;
  if(Math.hypot(ev.clientX-d.startX,ev.clientY-d.startY)>4) d.moved=true;
  const rawX=((ev.clientX-d.rect.left-d.panX)*d.worldScale/(d.zoom*d.rect.width))*100;
  const rawY=((ev.clientY-d.rect.top-d.panY)*d.worldScale/(d.zoom*d.rect.height))*100;
  const x=clampMap(rawX,0,100);
  const y=clampMap(rawY,0,100);
  d.char.mapX=Number(x.toFixed(2)); d.char.mapY=Number(y.toFixed(2));
  d.el.style.left=d.char.mapX+"%"; d.el.style.top=d.char.mapY+"%";
  updateCharacterMapLines();
}
function finishMapNodeDrag(ev){
  if(!mapDrag) return;
  mapDrag.el.removeEventListener("pointermove",moveMapNodeDrag);
  mapDrag.el.classList.remove("dragging");
  if(mapDrag.moved){
    suppressMapClick=true; setTimeout(()=>suppressMapClick=false,0);
    mapDrag.book.updatedAt=now(); save();
  }
  mapDrag=null;
}
function cancelMapNodeDrag(ev){
  if(mapDrag){
    mapDrag.el.removeEventListener("pointermove",moveMapNodeDrag);
    mapDrag.el.classList.remove("dragging");
  }
  mapDrag=null;
}
function updateCharacterMapLines(){
  const b=curBook(); if(!b) return;
  const pos=characterMapPositions(b);
  validCharacterLinks(b).forEach(link=>{
    const a=pos[link.from],c=pos[link.to],line=document.getElementById("mapLine"+link.id),shadow=document.getElementById("mapShadow"+link.id),hit=document.getElementById("mapHit"+link.id);

    document.getElementById("linkNote").value=editing.note||"";

/* ============ ИСТОРИЯ ВЕРСИЙ ============ */
function snapshotChapter(ch,manual){
  if(!ch) return false; ch.versions=ch.versions||[];
  const last=ch.versions[ch.versions.length-1];
  if(last&&last.content===ch.content){ if(manual) toast(t("noVersionChanges")); return false; }
  if(!manual&&!ch.content.trim()) return false;
  ch.versions.push({ts:now(),content:ch.content});
  if(ch.versions.length>MAX_VERSIONS) ch.versions=ch.versions.slice(-MAX_VERSIONS);
  save(); return true;
}
function snapshotCurrent(){ if(route.view==="chapter"){ const b=curBook(),ch=b&&b.chapters.find(c=>c.id===route.itemId); if(ch) snapshotChapter(ch,false); } }
function manualSnapshot(){ const b=curBook(),ch=b.chapters.find(c=>c.id===route.itemId); if(ch&&snapshotChapter(ch,true)) toast(t("versionSaved")); }
function openHistory(){
  const b=curBook(),ch=b.chapters.find(c=>c.id===route.itemId); if(!ch) return;
  const vers=(ch.versions||[]).slice().reverse();
  const rows=vers.length?vers.map((v,i)=>{
    const idx=ch.versions.length-1-i,d=new Date(v.ts);
    const when=d.toLocaleString(dateLocale(),{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"});
    const preview=(v.content||"").replace(/\s+/g," ").slice(0,70)||t("empty");
    const isCur=i===0&&v.content===ch.content;
    return `<div class="ver-row"><div class="vinfo">
      <div class="vt">${when}${isCur?` · <span style="color:var(--ok)">${t("current")}</span>`:''} · ${fmt(countWords(v.content))} ${t("words")}</div>
      <div class="vp">${escapeHtml(preview)}</div></div>
      <button class="btn small ghost" onclick="previewVersion('${ch.id}',${idx})">${icon('eye',16)}</button>
      <button class="btn small" onclick="restoreVersion('${ch.id}',${idx})">${t("restore")}</button></div>`;
  }).join(""):`<div class="mpad mmsg" style="padding:30px 26px">${t("noVersions")}</div>`;
  modal(`<h3>${t("chapterHistory")} «${escapeHtml(ch.title)}»</h3><div class="mbody">${rows}</div><div class="mfoot"><button class="btn" onclick="closeModal()">${t("close")}</button></div>`,"wide");
}
async function restoreVersion(chId,idx){
  const b=curBook(),ch=b.chapters.find(c=>c.id===chId); if(!ch) return;
  const v=ch.versions[idx]; if(!v) return;
  if(!await openConfirm({title:t("restoreVersionTitle"),message:t("restoreVersionMsg"),ok:t("restore"),danger:false})) return;
  snapshotChapter(ch,false); ch.content=v.content; ch.updatedAt=now(); save(); render(); toast(t("versionRestored"));
}
function previewVersion(chId,idx){
  const b=curBook(),ch=b.chapters.find(c=>c.id===chId); if(!ch) return;
  const v=ch.versions[idx]; if(!v) return;
  const d=new Date(v.ts).toLocaleString(dateLocale());
  modal(`<h3>${t("versionFrom")} ${d}</h3><div class="mbody" style="padding:18px 26px;font-family:Georgia,serif;line-height:1.7;white-space:pre-wrap">${escapeHtml(v.content)||t("empty")}</div>
    <div class="mfoot"><button class="btn" onclick="openHistory()">${t("backToList")}</button>
    <button class="btn primary" onclick="restoreVersion('${ch.id}',${idx})">${t("restoreThisText")}</button></div>`,"wide");
}

function pluralRu(n,one,two,many){
  n=Math.abs(Number(n)||0)%100;
  const n1=n%10;
  if(n>10&&n<20) return many;
  if(n1>1&&n1<5) return two;
  if(n1===1) return one;
  return many;
}

async function onRoleSelect(id){
  const sel=document.getElementById("cRoleSel");
  const c=curBook().characters.find(x=>x.id===id); if(!c) return;
  if(sel.value==="__custom"){
    const v=await openInput({title:t("customRole"),label:t("role"),placeholder:t("customRolePh"),ok:t("add")});

  }
}

function openTrash(){
  ensureData();
  const rows=[
    ...state.trash.books.map((x,i)=>trashRow("books",i,t("book"),titleOrFallback(x.data.title),t("withChaptersCharacters"),x.deletedAt)),
    ...state.trash.chapters.map((x,i)=>trashRow("chapters",i,t("chapter"),titleOrFallback(x.data.title),`${t("fromBook")} «${titleOrFallback(x.bookTitle)}»`,x.deletedAt)),
    ...state.trash.characters.map((x,i)=>trashRow("characters",i,characterFallback(),nameOrFallback(x.data.name),`${t("fromBook")} «${titleOrFallback(x.bookTitle)}»`,x.deletedAt)),
    ...state.trash.lore.map((x,i)=>trashRow("lore",i,labelEnum("lore",x.data.type||"Лор"),titleOrFallback(x.data.title),`${t("fromBook")} «${titleOrFallback(x.bookTitle)}»`,x.deletedAt))
  ].join("");
  const total=trashCount();
  modal(`<h3>${t("trash")}</h3>
    <div class="mbody trash-list">
      ${rows||`<div class="search-empty">${t("trashEmpty")}</div>`}
    </div>
    <div class="mfoot">
      ${total?`<button class="btn danger" onclick="emptyTrash()">${icon('trash',16)} ${t("clear")}</button>`:""}
      <button class="btn primary" onclick="closeModal()">${t("done")}</button>

}
function trashRow(type,idx,kind,title,sub,deletedAt){
  const when=deletedAt?new Date(deletedAt).toLocaleString(dateLocale(),{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"}):"";
  return `<div class="trash-card">
    <div class="trash-head"><span class="trash-kind">${kind}</span><span class="trash-title">${escapeHtml(title)}</span></div>
    <div class="trash-sub">${escapeHtml(sub)}${when?` · ${when}`:""}</div>
    <div class="trash-actions">
      <button class="btn small primary" onclick="restoreTrash('${type}',${idx})">${icon('restore',15)} ${t("restore")}</button>
      <button class="btn small ghost" onclick="purgeTrash('${type}',${idx})">${icon('x',15)} ${t("deleteForever")}</button>
    </div>
  </div>`;
}
function ensureUniqueBookId(book){
  if(!getBook(book.id)) return book;
  book.id=uid();
  return book;
}
function ensureUniqueItemId(list,item){
  if(!list.some(x=>x.id===item.id)) return item;
  item.id=uid();
  return item;
}
function fallbackBookForTrash(title){
  const b={id:uid(),title:title||t("restoredBook"),createdAt:now(),updatedAt:now(),
    year:"",era:"",place:"",synopsis:"",chapters:[],characters:[],lore:[]};
  state.books.unshift(b);
  return b;
}
function restoreTrash(type,idx){
  ensureData();
  const item=state.trash[type]&&state.trash[type][idx]; if(!item) return;
  if(type==="books"){
    const book=ensureUniqueBookId(cloneData(item.data));
    book.updatedAt=now(); state.books.unshift(book);
  }
  if(type==="chapters"){
    let b=getBook(item.bookId) || fallbackBookForTrash(item.bookTitle||t("restoredBook"));
    const ch=ensureUniqueItemId(b.chapters,normalizeChapter(cloneData(item.data)));
    ch.updatedAt=now(); b.chapters.push(ch); b.updatedAt=now();
  }
  if(type==="characters"){
    let b=getBook(item.bookId) || fallbackBookForTrash(item.bookTitle||t("restoredBook"));
    const c=ensureUniqueItemId(b.characters,cloneData(item.data));
    b.characters.push(c); b.updatedAt=now();
  }
  if(type==="lore"){
    let b=getBook(item.bookId) || fallbackBookForTrash(item.bookTitle||t("restoredBook"));
    b.lore=Array.isArray(b.lore)?b.lore:[];
    const lore=ensureUniqueItemId(b.lore,normalizeLore(cloneData(item.data)));
    b.lore.unshift(lore); b.updatedAt=now();
  }
  state.trash[type].splice(idx,1);
  save(); toast(t("restored")); openTrash(); render();
}
async function purgeTrash(type,idx){
  ensureData();
  const item=state.trash[type]&&state.trash[type][idx]; if(!item) return;
  if(!await openConfirm({title:t("deleteForeverTitle"),message:t("deleteForeverMsg"),ok:t("delete"),danger:true})) return;
  state.trash[type].splice(idx,1); save(); openTrash(); renderTopbar();
}
async function emptyTrash(){
  if(!await openConfirm({title:t("emptyTrashTitle"),message:t("emptyTrashMsg"),ok:t("clear"),danger:true})) return;
  state.trash={books:[],chapters:[],characters:[],lore:[]}; save(); openTrash(); renderTopbar();
}

/* ============ ПОИСК ============ */
function openSearch(){
  modal(`<h3>${t("search")}</h3>
    <div class="mpad">
      <div class="search-box">${icon('search',20)}<input class="search-input" id="searchInput" placeholder="${escapeAttr(t("searchPh"))}" autocomplete="off"></div>
    </div>
    <div class="mbody search-results" id="searchResults"></div>
    <div class="mfoot"><button class="btn" onclick="closeModal()">${t("close")}</button></div>`,"wide");
  const input=document.getElementById("searchInput");
  input.focus();
  const run=()=>renderSearchResults(input.value);
  input.addEventListener("input",run);
  input.addEventListener("keydown",e=>{ if(e.key==="Enter"){ const first=document.querySelector(".search-result"); if(first) first.click(); } });
  renderSearchResults("");
}
function renderSearchResults(query){
  const box=document.getElementById("searchResults"); if(!box) return;
  const q=(query||"").trim();
  if(q.length<2){ box.innerHTML=`<div class="search-empty">${t("searchMin")}</div>`; return; }
  const tokens=q.toLocaleLowerCase(dateLocale()).split(/\s+/).filter(Boolean);
  const results=collectSearchItems().map(item=>{
    const hay=(item.title+"\n"+item.bookTitle+"\n"+item.kind+"\n"+item.text).toLocaleLowerCase(dateLocale());
    if(!tokens.every(t=>hay.includes(t))) return null;
    const titleHay=(item.title+"\n"+item.bookTitle).toLocaleLowerCase(dateLocale());
    const score=tokens.reduce((s,t)=>s+(titleHay.includes(t)?10:1),0);
    return {...item,score,snippet:makeSnippet(item.title+"\n"+item.text,tokens)};
  }).filter(Boolean).sort((a,b)=>b.score-a.score||a.kind.localeCompare(b.kind,dateLocale())).slice(0,80);
  if(!results.length){ box.innerHTML=`<div class="search-empty">${t("searchNothing")}</div>`; return; }
  box.innerHTML=results.map(r=>`<div class="search-result" onclick="openSearchResult('${r.bookId}','${r.view}','${r.itemId||''}')">
    <div class="sr-top"><span class="sr-kind">${escapeHtml(r.kind)}</span><span class="sr-title">${escapeHtml(r.title)}</span></div>
    <div class="sr-book">${escapeHtml(r.bookTitle)}</div>
    <div class="sr-snippet">${highlightText(r.snippet,tokens)}</div>
  </div>`).join("");
}
function collectSearchItems(){
  const items=[];
  state.books.forEach(b=>{
    const bookTitle=titleOrFallback(b.title);
    items.push({
      bookId:b.id,view:"overview",itemId:"",kind:t("book"),title:bookTitle,bookTitle,
      text:[b.title,b.year,b.era,b.place,b.synopsis].filter(Boolean).join("\n")
    });
    (b.chapters||[]).forEach((c,i)=>items.push({
      bookId:b.id,view:"chapter",itemId:c.id,kind:`${t("chapter")} ${i+1}`,title:titleOrFallback(c.title),bookTitle,
      text:[c.title,c.planStatus,c.planSummary,c.planNotes,c.content].filter(Boolean).join("\n")
    }));
    (b.characters||[]).forEach(c=>items.push({
      bookId:b.id,view:"character",itemId:c.id,kind:t("charactersGroup").slice(0,-1),title:nameOrFallback(c.name),bookTitle,
      text:[c.name,c.role,c.age,c.appearance,c.personality,c.background,c.goals,c.relationships,c.notes].filter(Boolean).join("\n")
    }));
    validCharacterLinks(b).forEach(link=>items.push({
      bookId:b.id,view:"characterMap",itemId:"",kind:t("link"),title:`${characterName(b,link.from)} — ${characterName(b,link.to)}`,bookTitle,
      text:[characterName(b,link.from),characterName(b,link.to),link.type,link.note].filter(Boolean).join("\n")
    }));
    (b.lore||[]).forEach(item=>items.push({
      bookId:b.id,view:"lore",itemId:item.id,kind:labelEnum("lore",item.type||"Лор"),title:titleOrFallback(item.title),bookTitle,
      text:[item.title,item.type,item.summary,item.details,item.links].filter(Boolean).join("\n")
    }));
  });
  return items;
}
function makeSnippet(text,tokens){
  const src=(text||"").replace(/\s+/g," ").trim();
  if(!src) return "";
  const lower=src.toLocaleLowerCase(dateLocale());
  let pos=-1;
  tokens.forEach(t=>{ const i=lower.indexOf(t); if(i>=0&&(pos<0||i<pos)) pos=i; });
  if(pos<0) pos=0;
  const start=Math.max(0,pos-70),end=Math.min(src.length,pos+170);
  return `${start>0?"...":""}${src.slice(start,end)}${end<src.length?"...":""}`;
}
function highlightText(text,tokens){
  const uniq=[...new Set(tokens)].filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!uniq.length) return escapeHtml(text);
  const rx=new RegExp("("+uniq.map(escapeRegExp).join("|")+")","gi");
  let out="",last=0;
  (text||"").replace(rx,(m,...args)=>{
    const offset=args[args.length-2];
    out+=escapeHtml(text.slice(last,offset))+`<mark>${escapeHtml(m)}</mark>`;
    last=offset+m.length;
    return m;
  });
  out+=escapeHtml((text||"").slice(last));
  return out;
}
function escapeRegExp(s){ return (s||"").replace(/[.*+?^${}()|[\]\\]/g,"\\$&"); }
function openSearchResult(bookId,view,itemId){
  const b=getBook(bookId); if(!b) return;
  closeModal();
  route={screen:"book",bookId,view,itemId:itemId||null,charMode:"view"};
  render();
}

/* ============ ЭКСПОРТ ============ */
function buildBookText(b){ let out=b.title.toUpperCase()+"\n\n"; b.chapters.forEach((c,i)=>{ out+=(c.title||(`${t("chapter")} ${i+1}`))+"\n\n"+(c.content||"")+"\n\n\n"; }); return out; }
function openExport(){
  modal(`<h3>${t("exportBook")}</h3><div class="mpad">
    <button class="btn" style="width:100%;justify-content:flex-start;margin-bottom:10px;padding:14px 16px" onclick="exportDocx()">${icon('word',20)} ${t("docxExport")}</button>
    <button class="btn" style="width:100%;justify-content:flex-start;padding:14px 16px" onclick="exportTxt()">${icon('txt',20)} ${t("txtExport")}</button>
    </div><div class="mfoot"><button class="btn" onclick="closeModal()">${t("cancel")}</button></div>`);
}
async function exportDocx(){
  const a=api(); if(!a) return;
  closeModal(); snapshotCurrent();
  const res=await a.export_docx(curBook(),lang());
  if(apiOk(res)) toast(t("wordSaved"));
  else if(apiError(res,"")) openInfo(t("failTitle"),apiError(res,t("wordFail")));
}
async function exportTxt(){
  const a=api(); if(!a) return;
  closeModal(); snapshotCurrent();
  const res=await a.export_txt(buildBookText(curBook()),lang());
  if(apiOk(res)) toast(t("txtSaved"));
  else if(apiError(res,"")) openInfo(t("failTitle"),apiError(res,t("txtFail")));
}

/* ============ ПРЕДПРОСМОТР ============ */
function openPreview(){
  snapshotCurrent(); const b=curBook();
  let html=`<div class="pv-toolbar"><button class="btn small primary" onclick="closePreview()">${icon('x',16)} ${t("close")}</button></div>
    <div class="pv-page pv-title-page"><div class="tt">${escapeHtml(b.title)}</div>
    <div class="ta">${bookWordCount(b)?'≈'+fmt(Math.max(1,Math.round(bookWordCount(b)/WORDS_PER_PAGE)))+' '+t("pagesFull"):''}</div></div>`;
  b.chapters.forEach((c,i)=>{
    const paras=(c.content||"").split(/\n+/).filter(p=>p.trim()).map(p=>`<p>${escapeHtml(p)}</p>`).join("");
    html+=`<div class="pv-page"><div class="pv-cnum">${t("chapterUpper")} ${i+1}</div><h2>${escapeHtml(c.title||"")}</h2>
      ${paras||`<p style="color:#bbb;text-indent:0">${t("emptyChapter")}</p>`}</div>`;
  });
  const pv=document.getElementById("preview"); pv.innerHTML=html; pv.classList.remove("hidden");
}
function closePreview(){ document.getElementById("preview").classList.add("hidden"); }

/* ============ РЕЗЕРВНЫЕ КОПИИ ============ */
async function exportBackup(){
  const a=api(); if(!a) return;
  snapshotCurrent();
  const res=await a.export_backup(JSON.stringify(state,null,1),lang());
  if(apiOk(res)) toast(t("backupSaved"));
  else if(apiError(res,"")) openInfo(t("failTitle"),apiError(res,t("backupFail")));
}
async function importBackup(){
  const a=api(); if(!a) return;
  const raw=await a.import_backup(lang()); if(!raw) return;
  let d; try{ d=JSON.parse(raw); if(!d.books) throw 0; }catch(e){ return openInfo(t("failTitle"),t("badBackup")); }
  if(!await openConfirm({title:t("replaceBooks"),message:t("replaceBooksMsg"),ok:t("replace"),danger:false})) return;
  snapshotCurrent();
  const backup=await a.backup_state(JSON.stringify(state,null,1),t("beforeImport"),lang());
  if(!apiOk(backup)) return openInfo(t("failTitle"),apiError(backup,t("oldBackupFail")));
  state=d; if(!state.settings) state.settings={fontSize:19,theme:"light",accent:DEFAULT_ACCENT};
  if(!state.settings.accent) state.settings.accent=DEFAULT_ACCENT;
  if(state.settings.lang!=="en") state.settings.lang="ru";
  document.documentElement.lang=state.settings.lang;
  applyTheme(); save(); goHome(); toast(t("backupLoaded"));
}

/* ============ МОДАЛКИ ============ */
function openCharacterPhoto(id){
  const b=curBook();
  const c=b&&b.characters.find(x=>x.id===id);
  if(!c||!c.photo) return;
  modal(`<div class="photo-view-head">
      <h3>${escapeHtml(c.name||t("photoAlt"))}</h3>
      <button class="btn icon ghost" id="mClosePhoto" title="${t("close")}">${icon('x',16)}</button>
    </div>
    <div class="photo-view-body"><img src="${c.photo}" alt="${escapeAttr(c.name||t("photoAlt"))}"></div>`,"photo");
  const done=()=>closeModal();
  document.getElementById("mClosePhoto").onclick=done;
  document.getElementById("mback").onclick=e=>{ if(e.target.id==="mback") done(); };
}
function modal(html,cls){ document.getElementById("modalRoot").innerHTML=`<div class="modal-back" id="mback"><div class="modal ${cls||''}">${html}</div></div>`; }
function closeModal(){ document.getElementById("modalRoot").innerHTML=""; }
function openInput({title,label,value="",placeholder="",ok=t("done")}){
  return new Promise(res=>{
    modal(`<h3>${escapeHtml(title)}</h3><div class="mpad">${label?`<label class="flbl">${escapeHtml(label)}</label>`:''}
      <input class="finput" id="mInput" value="${escapeAttr(value)}" placeholder="${escapeAttr(placeholder)}"></div>
      <div class="mfoot"><button class="btn" id="mCancel">${t("cancel")}</button><button class="btn primary" id="mOk">${escapeHtml(ok)}</button></div>`);
    const inp=document.getElementById("mInput"); inp.focus(); inp.select();
    const done=v=>{ closeModal(); res(v); };
    document.getElementById("mOk").onclick=()=>done(inp.value);
    document.getElementById("mCancel").onclick=()=>done(null);
    document.getElementById("mback").onclick=e=>{ if(e.target.id==="mback") done(null); };
    inp.onkeydown=e=>{ if(e.key==="Enter"){e.preventDefault();done(inp.value);} if(e.key==="Escape")done(null); };
  });
}
function openConfirm({title,message,ok=t("delete"),danger=true}){
  return new Promise(res=>{
    modal(`<h3>${escapeHtml(title)}</h3><div class="mpad mmsg">${escapeHtml(message||"")}</div>
      <div class="mfoot"><button class="btn" id="mCancel">${t("cancel")}</button><button class="btn ${danger?'danger':'primary'}" id="mOk">${escapeHtml(ok)}</button></div>`);
    const done=v=>{ closeModal(); res(v); };
    document.getElementById("mOk").onclick=()=>done(true);
    document.getElementById("mCancel").onclick=()=>done(false);
    document.getElementById("mback").onclick=e=>{ if(e.target.id==="mback") done(false); };
  });
}
function openInfo(title,message){
  return new Promise(res=>{
    modal(`<h3>${escapeHtml(title)}</h3><div class="mpad mmsg">${escapeHtml(message)}</div>
      <div class="mfoot"><button class="btn primary" id="mOk">${t("understand")}</button></div>`);
    const done=()=>{ closeModal(); res(); };
    document.getElementById("mOk").onclick=done;
    document.getElementById("mback").onclick=e=>{ if(e.target.id==="mback") done(); };
  });
}

/* ============ ТОСТ / УТИЛИТЫ ============ */
let toastTimer=null;
function toast(msg){ const t=document.getElementById("toast"); t.innerHTML=`${icon('clock',15)} ${escapeHtml(msg)}`; t.classList.add("show");
  clearTimeout(toastTimer); toastTimer=setTimeout(()=>t.classList.remove("show"),2000); }
function escapeHtml(s){ return (s||"").replace(/[&<>]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[m])); }
function escapeAttr(s){ return (s||"").replace(/&/g,"&amp;").replace(/"/g,"&quot;").replace(/</g,"&lt;"); }

document.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="f"){ e.preventDefault(); openSearch(); }
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="s"){ e.preventDefault(); if(route.view==="chapter") manualSnapshot(); }
  if(e.key==="Escape"){
    if(document.querySelector(".modal.photo")){ closeModal(); return; }
    if(!document.getElementById("preview").classList.contains("hidden")) closePreview();
  }
});

if(window.pywebview&&window.pywebview.api){ boot(); }
else { window.addEventListener("pywebviewready",boot); }
setTimeout(()=>{ const h=document.getElementById("homeInner"); if(h&&!h.innerHTML){ applyTheme(); render(); } },1500);
